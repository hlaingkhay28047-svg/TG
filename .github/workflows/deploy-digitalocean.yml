name: DigitalOcean Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalocean-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Keep hnk-ai-tools-3 live on main
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DO_APP_NAME: hnk-ai-tools-3
      DO_APP_HOST: hnk-ai-tools-3-s4nnu.ondigitalocean.app
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || secrets.DIGITALOCEAN_TOKEN || secrets.DO_TOKEN }}
    steps:
      - name: Check DigitalOcean token
        id: auth
        shell: bash
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DigitalOcean API token is stored in GitHub. Production should still auto-deploy when hnk-ai-tools-3 is connected to GitHub/main with deploy_on_push enabled."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install doctl fallback
        if: steps.auth.outputs.available == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ env.DO_TOKEN }}
          version: 1.166.0

      - name: Resolve existing DigitalOcean app
        if: steps.auth.outputs.available == 'true'
        id: app
        shell: bash
        run: |
          set -euo pipefail
          doctl apps list --output json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg name "$DO_APP_NAME" --arg host "$DO_APP_HOST" '
            .[]
            | select((.spec.name == $name) or (.default_ingress == $host) or (.live_url == ("https://" + $host)))
            | .id
          ' "$RUNNER_TEMP/apps.json" | head -n 1)"
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::DigitalOcean app $DO_APP_NAME ($DO_APP_HOST) was not found in this token's account."
            exit 1
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Force deploy as API fallback
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          doctl apps create-deployment "${{ steps.app.outputs.app_id }}" \
            --update-sources \
            --force-rebuild \
            --wait \
            --format ID,Phase,Updated

      - name: Verify production live release
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(jq -r '.v' docs/app/version.json)"
          EXPECTED_LANDING_SHA="$(sha256sum docs/index.html | awk '{print $1}')"
          LIVE_FILE="$RUNNER_TEMP/production-index.html"
          echo "Expecting HNK Web Studio ${EXPECTED_VERSION} and landing ${EXPECTED_LANDING_SHA} on ${DO_APP_HOST}."
          for attempt in $(seq 1 120); do
            VERSION_URL="https://${DO_APP_HOST}/app/version.json?sha=${GITHUB_SHA}&attempt=${attempt}"
            LANDING_URL="https://${DO_APP_HOST}/?sha=${GITHUB_SHA}&attempt=${attempt}"
            ACTUAL_VERSION="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$VERSION_URL" 2>/dev/null | jq -r '.v // empty' 2>/dev/null || true)"
            ACTUAL_LANDING_SHA=""
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$LANDING_URL" -o "$LIVE_FILE" 2>/dev/null; then
              ACTUAL_LANDING_SHA="$(sha256sum "$LIVE_FILE" | awk '{print $1}')"
            fi
            if [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] && [ "$ACTUAL_LANDING_SHA" = "$EXPECTED_LANDING_SHA" ]; then
              echo "Verified production version ${ACTUAL_VERSION} and exact landing content."
              exit 0
            fi
            echo "Attempt ${attempt}/120: version='${ACTUAL_VERSION:-unavailable}', landing='${ACTUAL_LANDING_SHA:-unavailable}'."
            sleep 15
          done
          echo "::error::Production did not publish version ${EXPECTED_VERSION} with landing SHA-256 ${EXPECTED_LANDING_SHA}. Ensure hnk-ai-tools-3 follows GitHub/main or configure the API-token fallback."
          exit 1
