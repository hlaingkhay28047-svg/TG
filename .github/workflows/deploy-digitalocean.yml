name: DigitalOcean Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Manually force a DigitalOcean rebuild (requires the production token secret)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: digitalocean-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Keep hnk-ai-tools-3 live on main
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      DO_APP_NAME: hnk-ai-tools-3
      DO_APP_HOST: hnk-ai-tools-3-s4nnu.ondigitalocean.app
      DO_REPO: hlaingkhay28047-svg/TG
      DO_BRANCH: main
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_PRODUCTION_ACCESS_TOKEN }}
    steps:
      - name: Guard manual dispatch lane
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production recovery must be dispatched from main, not $GITHUB_REF."
            exit 1
          fi

      - name: Record shared deployment deadline
        shell: bash
        run: echo "JOB_DEADLINE_EPOCH=$(( $(date +%s) + 1980 ))" >> "$GITHUB_ENV"

      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check DigitalOcean token
        id: auth
        shell: bash
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No production API token is stored in GitHub. Normal pushes deploy through the hnk-ai-tools-3 GitHub source binding."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require token for manual recovery
        if: github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true && steps.auth.outputs.available != 'true'
        shell: bash
        run: |
          echo "::error::Manual production recovery requires DIGITALOCEAN_PRODUCTION_ACCESS_TOKEN."
          exit 1

      - name: Install doctl for manual recovery
        if: github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true && steps.auth.outputs.available == 'true'
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ env.DO_TOKEN }}
          version: 1.166.0

      - name: Resolve and validate production app
        if: github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true && steps.auth.outputs.available == 'true'
        id: app
        shell: bash
        run: |
          set -euo pipefail
          doctl apps list --output json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg name "$DO_APP_NAME" --arg host "$DO_APP_HOST" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            .[]
            | select((.spec.name == $name) or (.default_ingress == $host) or (.live_url == ("https://" + $host)))
            | select(any(.spec.static_sites[]?; .github.repo == $repo and .github.branch == $branch))
            | .id
          ' "$RUNNER_TEMP/apps.json" | head -n 1)"
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::DigitalOcean production app $DO_APP_NAME ($DO_APP_HOST) was not found with source $DO_REPO@$DO_BRANCH. No deployment was created."
            exit 1
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Force production deploy for manual recovery
        if: github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true && steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RECOVERY_TIMEOUT_SECONDS=$(( JOB_DEADLINE_EPOCH - $(date +%s) - 120 ))
          if [ "$RECOVERY_TIMEOUT_SECONDS" -le 0 ]; then
            echo "::error::Not enough time remains for manual recovery and live verification."
            exit 1
          fi
          if ! timeout --foreground --signal=TERM "${RECOVERY_TIMEOUT_SECONDS}s" \
            doctl apps create-deployment "${{ steps.app.outputs.app_id }}" \
            --update-sources \
            --force-rebuild \
            --wait \
            --format ID,Phase,Updated; then
            echo "::error::Manual production recovery did not finish before its bounded deadline."
            exit 1
          fi

      - name: Verify production live release
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(jq -r '.v' docs/app/version.json)"
          EXPECTED_LANDING_SHA="$(sha256sum docs/index.html | awk '{print $1}')"
          EXPECTED_APP_SHA="$(sha256sum docs/app/index.html | awk '{print $1}')"
          LANDING_FILE="$RUNNER_TEMP/production-index.html"
          APP_FILE="$RUNNER_TEMP/production-app-index.html"
          DEADLINE_EPOCH="${JOB_DEADLINE_EPOCH:?deployment deadline was not recorded}"
          attempt=0
          echo "Expecting HNK Web Studio ${EXPECTED_VERSION}, landing ${EXPECTED_LANDING_SHA}, and app ${EXPECTED_APP_SHA} on ${DO_APP_HOST}."
          while [ "$(date +%s)" -lt "$DEADLINE_EPOCH" ]; do
            attempt=$((attempt + 1))
            VERSION_URL="https://${DO_APP_HOST}/app/version.json?sha=${GITHUB_SHA}&attempt=${attempt}"
            LANDING_URL="https://${DO_APP_HOST}/?sha=${GITHUB_SHA}&attempt=${attempt}"
            APP_URL="https://${DO_APP_HOST}/app/?sha=${GITHUB_SHA}&attempt=${attempt}"
            ACTUAL_VERSION="$(curl -fsSL --max-time 5 -H 'Cache-Control: no-cache' "$VERSION_URL" 2>/dev/null | jq -r '.v // empty' 2>/dev/null || true)"
            ACTUAL_LANDING_SHA=""
            ACTUAL_APP_SHA=""
            if curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' "$LANDING_URL" -o "$LANDING_FILE" 2>/dev/null; then
              ACTUAL_LANDING_SHA="$(sha256sum "$LANDING_FILE" | awk '{print $1}')"
            fi
            if [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] && [ "$ACTUAL_LANDING_SHA" = "$EXPECTED_LANDING_SHA" ]; then
              if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$APP_URL" -o "$APP_FILE" 2>/dev/null; then
                ACTUAL_APP_SHA="$(sha256sum "$APP_FILE" | awk '{print $1}')"
              fi
            fi
            if [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] && [ "$ACTUAL_LANDING_SHA" = "$EXPECTED_LANDING_SHA" ] && [ "$ACTUAL_APP_SHA" = "$EXPECTED_APP_SHA" ]; then
              echo "Verified production version ${ACTUAL_VERSION} with exact landing and app HTML."
              exit 0
            fi
            echo "Attempt ${attempt}: version='${ACTUAL_VERSION:-unavailable}', landing='${ACTUAL_LANDING_SHA:-unavailable}', app='${ACTUAL_APP_SHA:-unavailable}'."
            if [ $(( $(date +%s) + 15 )) -ge "$DEADLINE_EPOCH" ]; then
              break
            fi
            sleep 15
          done
          echo "::error::Production did not publish version ${EXPECTED_VERSION}, landing SHA-256 ${EXPECTED_LANDING_SHA}, and app SHA-256 ${EXPECTED_APP_SHA} before the shared 33-minute job deadline. Check the hnk-ai-tools-3 GitHub source binding."
          exit 1
