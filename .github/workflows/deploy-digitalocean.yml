name: DigitalOcean Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digitalocean-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Keep hnk-ai-tools-3 live on main
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DO_APP_NAME: hnk-ai-tools-3
      DO_APP_HOST: hnk-ai-tools-3-s4nnu.ondigitalocean.app
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || secrets.DIGITALOCEAN_TOKEN || secrets.DO_TOKEN }}
    steps:
      - name: Check DigitalOcean token
        id: auth
        shell: bash
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DigitalOcean API token is stored in GitHub. Production should still auto-deploy when hnk-ai-tools-3 is connected to GitHub/main with deploy_on_push enabled."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release metadata
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install doctl fallback
        if: steps.auth.outputs.available == 'true'
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ env.DO_TOKEN }}
          version: 1.164.0

      - name: Resolve existing DigitalOcean app
        if: steps.auth.outputs.available == 'true'
        id: app
        shell: bash
        run: |
          set -euo pipefail
          doctl apps list --output json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg name "$DO_APP_NAME" --arg host "$DO_APP_HOST" '
            .[]
            | select((.spec.name == $name) or (.default_ingress == $host) or (.live_url == ("https://" + $host)))
            | .id
          ' "$RUNNER_TEMP/apps.json" | head -n 1)"
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::DigitalOcean app $DO_APP_NAME ($DO_APP_HOST) was not found in this token's account."
            exit 1
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Force deploy as API fallback
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          doctl apps create-deployment "${{ steps.app.outputs.app_id }}" \
            --update-sources \
            --force-rebuild \
            --wait \
            --format ID,Phase,Updated

      - name: Verify production live release version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(jq -r '.v' docs/app/version.json)"
          LIVE_URL="https://${DO_APP_HOST}/app/version.json?sha=${GITHUB_SHA}"
          echo "Expecting HNK Web Studio ${EXPECTED} at ${LIVE_URL}"
          for attempt in $(seq 1 30); do
            ACTUAL="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "$LIVE_URL" 2>/dev/null | jq -r '.v // empty' 2>/dev/null || true)"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "Verified production live HNK Web Studio ${ACTUAL}."
              exit 0
            fi
            echo "Attempt ${attempt}/30: production is '${ACTUAL:-unavailable}', waiting for ${EXPECTED}."
            sleep 10
          done
          echo "::error::Production did not report version ${EXPECTED}. Ensure hnk-ai-tools-3 is connected to GitHub/main with deploy_on_push enabled, or add a DigitalOcean API token secret for the fallback deploy."
          exit 1
