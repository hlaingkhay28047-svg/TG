name: Verify DigitalOcean Deploy

on:
  push:
    branches: [main, upgrade-safe-wave]
    paths:
      - '.do/app.yaml'
      - '.do/staging.app.yaml'
      - '.github/workflows/deploy-digitalocean.yml'
      - '.github/workflows/deploy-digitalocean-staging.yml'
      - '.github/workflows/read-production-health.yml'
      - '.github/workflows/verify-digitalocean-deploy.yml'
      - '.github/scripts/patch_digitalocean_spec.js'
      - 'server/index.js'
      - 'server/lib/migrate.js'
      - 'test/verify_digitalocean_deploy.js'
      - 'test/verify_digitalocean_spec_patch.js'
  pull_request:
    paths:
      - '.do/app.yaml'
      - '.do/staging.app.yaml'
      - '.github/workflows/deploy-digitalocean.yml'
      - '.github/workflows/deploy-digitalocean-staging.yml'
      - '.github/workflows/read-production-health.yml'
      - '.github/workflows/verify-digitalocean-deploy.yml'
      - '.github/scripts/patch_digitalocean_spec.js'
      - 'server/index.js'
      - 'server/lib/migrate.js'
      - 'test/verify_digitalocean_deploy.js'
      - 'test/verify_digitalocean_spec_patch.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node test/verify_digitalocean_deploy.js
      - run: node test/verify_digitalocean_spec_patch.js
