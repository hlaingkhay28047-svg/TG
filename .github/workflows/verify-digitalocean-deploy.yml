name: Verify DigitalOcean Deploy

on:
  push:
    branches: [main]
    paths:
      - '.do/app.yaml'
      - '.do/staging.app.yaml'
      - '.github/workflows/deploy-digitalocean.yml'
      - '.github/workflows/deploy-digitalocean-staging.yml'
      - '.github/workflows/verify-digitalocean-deploy.yml'
      - 'test/verify_digitalocean_deploy.js'
  pull_request:
    paths:
      - '.do/app.yaml'
      - '.do/staging.app.yaml'
      - '.github/workflows/deploy-digitalocean.yml'
      - '.github/workflows/deploy-digitalocean-staging.yml'
      - '.github/workflows/verify-digitalocean-deploy.yml'
      - 'test/verify_digitalocean_deploy.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node test/verify_digitalocean_deploy.js
