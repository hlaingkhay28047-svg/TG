name: Temporary DigitalOcean Staging Validation

on:
  push:
    branches: [upgrade-safe-wave]
    paths:
      - .do/run-temporary-staging-validation

permissions:
  contents: read

concurrency:
  group: digitalocean-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Create, verify and remove temporary staging API
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DO_APP_NAME: hnk-ai-tools-2
      DO_APP_HOST: hnk-ai-tools-2-gibhz.ondigitalocean.app
      DO_REPO: hlaingkhay28047-svg/TG
      DO_BRANCH: upgrade-safe-wave
      DO_SERVICE: hnk-api
      DO_DATABASE: "hnk-tmp-${{ github.run_id }}"
      DO_STATIC_SITE: hnk-web
      DO_MARKER: "run-${{ github.run_id }}"
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_STAGING_ACCESS_TOKEN }}

    steps:
      - name: Reserve an independent cleanup window
        shell: bash
        run: echo "VERIFY_DEADLINE_EPOCH=$(( $(date +%s) + 2400 ))" >> "$GITHUB_ENV"

      - name: Check out exact staging source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the reversible spec transform
        shell: bash
        run: node test/verify_temporary_staging_spec.js

      - name: Require the staging token
        shell: bash
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::DIGITALOCEAN_STAGING_ACCESS_TOKEN is missing."
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ env.DO_TOKEN }}
          version: 1.166.0

      - name: Resolve the existing static-only staging app
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          doctl apps list --output json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(jq -r --arg name "$DO_APP_NAME" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            .[]
            | select(.spec.name == $name)
            | select(any(.spec.static_sites[]?; .github.repo == $repo and .github.branch == $branch))
            | .id
          ' "$RUNNER_TEMP/apps.json" | head -n 1)"
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::The exact static-only staging app was not found."
            exit 1
          fi
          echo "DO_APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Recover an orphan from a prior attempt of this same run
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          CURRENT_SPEC="$RUNNER_TEMP/staging-recovery-current.json"
          CLEANED_SPEC="$RUNNER_TEMP/staging-recovery-cleaned.json"
          NORMAL_CURRENT="$RUNNER_TEMP/staging-recovery-current-normalized.json"
          NORMAL_CLEANED="$RUNNER_TEMP/staging-recovery-cleaned-normalized.json"
          POST_SPEC="$RUNNER_TEMP/staging-recovery-post.json"
          doctl apps spec get "$DO_APP_ID" --format json > "$CURRENT_SPEC"
          node .github/scripts/temporary_staging_spec.js \
            cleanup "$CURRENT_SPEC" "$CLEANED_SPEC" \
            "$DO_APP_NAME" "$DO_SERVICE" "$DO_DATABASE" "$DO_STATIC_SITE" \
            "$DO_REPO" "$DO_BRANCH" "https://$DO_APP_HOST" "$DO_MARKER"
          jq -S . "$CURRENT_SPEC" > "$NORMAL_CURRENT"
          jq -S . "$CLEANED_SPEC" > "$NORMAL_CLEANED"
          if cmp -s "$NORMAL_CURRENT" "$NORMAL_CLEANED"; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "A prior attempt of this run left its marked resources behind; removing them before doing anything else."
          doctl apps propose --app "$DO_APP_ID" --spec "$CLEANED_SPEC" >/dev/null
          if timeout --foreground --signal=TERM --kill-after=15s 900s \
            doctl apps update "$DO_APP_ID" \
            --spec "$CLEANED_SPEC" \
            --wait \
            --format ID,DefaultIngress,Updated; then
            doctl apps spec get "$DO_APP_ID" --format json > "$POST_SPEC"
          else
            STATUS=$?
            echo "::error::Recovery cleanup failed or timed out (exit $STATUS). Temporary resources may still be billing."
            exit "$STATUS"
          fi
          if ! jq -e --arg service "$DO_SERVICE" --arg database "$DO_DATABASE" '
            (all(.services[]?; .name != $service)) and
            (all(.databases[]?; .name != $database)) and
            (all(.ingress.rules[]?; (.component.name // "") != $service))
          ' "$POST_SPEC" >/dev/null; then
            echo "::error::Recovery did not remove every resource owned by this run. It may still be billing."
            exit 1
          fi
          echo "recovered=true" >> "$GITHUB_OUTPUT"
          echo "Recovered the static-only staging app. This rerun will not recreate paid resources."

      - name: Prepare and validate the temporary full spec
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BASELINE_SPEC="$RUNNER_TEMP/staging-baseline.json"
          PATCHED_SPEC="$RUNNER_TEMP/staging-temporary.json"
          doctl apps spec get "$DO_APP_ID" --format json > "$BASELINE_SPEC"
          node .github/scripts/temporary_staging_spec.js \
            bootstrap "$BASELINE_SPEC" "$PATCHED_SPEC" \
            "$DO_APP_NAME" "$DO_SERVICE" "$DO_DATABASE" "$DO_STATIC_SITE" \
            "$DO_REPO" "$DO_BRANCH" "https://$DO_APP_HOST" "$DO_MARKER"
          doctl apps propose --app "$DO_APP_ID" --spec "$PATCHED_SPEC" >/dev/null
          echo "prepared=true" >> "$GITHUB_OUTPUT"
          echo "Validated a full-spec update while preserving the downloaded live staging configuration."

      - name: Create the temporary API and development database
        shell: bash
        run: |
          set -euo pipefail
          PATCHED_SPEC="$RUNNER_TEMP/staging-temporary.json"
          if timeout --foreground --signal=TERM --kill-after=15s 2100s \
            doctl apps update "$DO_APP_ID" \
            --spec "$PATCHED_SPEC" \
            --update-sources \
            --wait \
            --format ID,DefaultIngress,Updated; then
            echo "Temporary staging resources deployed."
          else
            STATUS=$?
            echo "::error::Temporary staging deployment failed or exceeded its bounded build window (exit $STATUS). Cleanup will still run."
            exit "$STATUS"
          fi

      - name: Verify the exact staging Web, API, schema and source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          EXPECTED_VERSION="$(jq -r '.v' docs/app/version.json)"
          EXPECTED_LANDING_SHA="$(sha256sum docs/index.html | awk '{print $1}')"
          EXPECTED_APP_SHA="$(sha256sum docs/app/index.html | awk '{print $1}')"
          EXPECTED_SCHEMA_SHA="$(sha256sum server/sql/schema.sql | awk '{print $1}')"
          LANDING_FILE="$RUNNER_TEMP/staging-index.html"
          APP_FILE="$RUNNER_TEMP/staging-app-index.html"
          LIVE_FILE="$RUNNER_TEMP/staging-live.json"
          READY_FILE="$RUNNER_TEMP/staging-ready.json"
          HEALTH_FILE="$RUNNER_TEMP/staging-health.json"
          APP_STATE_FILE="$RUNNER_TEMP/staging-app-state.json"
          LIVE_SPEC_FILE="$RUNNER_TEMP/staging-live-contract.json"
          attempt=0

          while [ "$(date +%s)" -lt "$VERIFY_DEADLINE_EPOCH" ]; do
            attempt=$((attempt + 1))
            ACTUAL_VERSION="$(curl -fsSL --max-time 5 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/app/version.json?sha=$GITHUB_SHA&attempt=$attempt" \
              2>/dev/null | jq -r '.v // empty' 2>/dev/null || true)"
            ACTUAL_LANDING_SHA=""
            ACTUAL_APP_SHA=""
            ACTUAL_API_VERSION=""
            ACTUAL_SCHEMA_SHA=""
            ACTUAL_READY="false"
            ACTUAL_LIVE="false"
            ACTUAL_READY_ENDPOINT="false"
            ACTUAL_TLS=""
            ACTUAL_SOURCE_SHA=""
            LIVE_SPEC_OK="false"

            if curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/?sha=$GITHUB_SHA&attempt=$attempt" \
              -o "$LANDING_FILE" 2>/dev/null; then
              ACTUAL_LANDING_SHA="$(sha256sum "$LANDING_FILE" | awk '{print $1}')"
            fi
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/app/?sha=$GITHUB_SHA&attempt=$attempt" \
              -o "$APP_FILE" 2>/dev/null; then
              ACTUAL_APP_SHA="$(sha256sum "$APP_FILE" | awk '{print $1}')"
            fi
            if curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/api/live?sha=$GITHUB_SHA&attempt=$attempt" \
              -o "$LIVE_FILE" 2>/dev/null; then
              ACTUAL_LIVE="$(jq -r '.live // false' "$LIVE_FILE" 2>/dev/null || echo false)"
            fi
            if curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/api/ready?sha=$GITHUB_SHA&attempt=$attempt" \
              -o "$READY_FILE" 2>/dev/null; then
              ACTUAL_READY_ENDPOINT="$(jq -r '.ready // false' "$READY_FILE" 2>/dev/null || echo false)"
            fi
            if curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/api/health?sha=$GITHUB_SHA&attempt=$attempt" \
              -o "$HEALTH_FILE" 2>/dev/null; then
              ACTUAL_API_VERSION="$(jq -r '.apiVersion // empty' "$HEALTH_FILE" 2>/dev/null || true)"
              ACTUAL_SCHEMA_SHA="$(jq -r '.schemaFingerprint // empty' "$HEALTH_FILE" 2>/dev/null || true)"
              ACTUAL_READY="$(jq -r '.ready // false' "$HEALTH_FILE" 2>/dev/null || echo false)"
              ACTUAL_TLS="$(jq -r '.tls // empty' "$HEALTH_FILE" 2>/dev/null || true)"
            fi

            if doctl apps spec get "$DO_APP_ID" --format json > "$LIVE_SPEC_FILE" 2>/dev/null; then
              LIVE_SPEC_OK="$(jq -r \
                --arg service "$DO_SERVICE" --arg database "$DO_DATABASE" \
                --arg marker "$DO_MARKER" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
                (([.services[]? | select(.name == $service and .github.repo == $repo and
                    .github.branch == $branch and
                    any(.envs[]?; .key == "HNK_EPHEMERAL_STAGING_RUN" and .value == $marker))]
                  | length) == 1) and
                (([.databases[]? | select(.name == $database and .engine == "PG" and
                    (.production // false) == false)] | length) == 1)
              ' "$LIVE_SPEC_FILE" 2>/dev/null || echo false)"
            fi
            if doctl apps get "$DO_APP_ID" --output json > "$APP_STATE_FILE" 2>/dev/null; then
              ACTUAL_SOURCE_SHA="$(jq -r --arg id "$DO_APP_ID" --arg service "$DO_SERVICE" '
                [.[0] | select(.id == $id) | .active_deployment.services[]?
                  | select(.name == $service) | .source_commit_hash // empty]
                | if length == 1 then .[0] else empty end
              ' "$APP_STATE_FILE")"
            fi

            if [ "$ACTUAL_VERSION" = "$EXPECTED_VERSION" ] && \
               [ "$ACTUAL_LANDING_SHA" = "$EXPECTED_LANDING_SHA" ] && \
               [ "$ACTUAL_APP_SHA" = "$EXPECTED_APP_SHA" ] && \
               [ "$ACTUAL_LIVE" = "true" ] && [ "$ACTUAL_READY_ENDPOINT" = "true" ] && \
               [ "$ACTUAL_API_VERSION" = "$EXPECTED_VERSION" ] && \
               [ "$ACTUAL_SCHEMA_SHA" = "$EXPECTED_SCHEMA_SHA" ] && \
               [ "$ACTUAL_READY" = "true" ] && \
               [ "$ACTUAL_TLS" = "unverified (no CA certificate supplied)" ] && \
               [ "$ACTUAL_SOURCE_SHA" = "$GITHUB_SHA" ] && [ "$LIVE_SPEC_OK" = "true" ]; then
              echo "Verified temporary staging Web/API $ACTUAL_VERSION, exact static files, liveness, readiness, schema fingerprint and source $ACTUAL_SOURCE_SHA."
              echo "The test-only dev database connection was encrypted but has no managed-database CA; production remains gated on tls:verified."
              exit 0
            fi

            echo "Attempt $attempt: web='$ACTUAL_VERSION', api='$ACTUAL_API_VERSION', source='$ACTUAL_SOURCE_SHA', live='$ACTUAL_LIVE', ready='$ACTUAL_READY', schema='$ACTUAL_SCHEMA_SHA', tls='$ACTUAL_TLS', spec='$LIVE_SPEC_OK'."
            if [ $(( $(date +%s) + 15 )) -ge "$VERIFY_DEADLINE_EPOCH" ]; then
              break
            fi
            sleep 15
          done
          echo "::error::The temporary staging release did not satisfy every Web/API/schema/source assertion before the cleanup window."
          exit 1

      - name: Always remove the temporary API and development database
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          BASELINE_SPEC="$RUNNER_TEMP/staging-baseline.json"
          CURRENT_SPEC="$RUNNER_TEMP/staging-before-cleanup.json"
          CLEANED_SPEC="$RUNNER_TEMP/staging-cleaned.json"
          NORMAL_BASELINE="$RUNNER_TEMP/staging-baseline-normalized.json"
          NORMAL_CLEANED="$RUNNER_TEMP/staging-cleaned-normalized.json"
          NORMAL_CURRENT="$RUNNER_TEMP/staging-current-normalized.json"
          POST_SPEC="$RUNNER_TEMP/staging-after-cleanup.json"
          APP_STATE_FILE="$RUNNER_TEMP/staging-after-cleanup-app.json"
          CLEANUP_DEPLOYMENT_FILE="$RUNNER_TEMP/staging-cleanup-deployment.json"
          CLEANUP_DEPLOYMENT_STATE_FILE="$RUNNER_TEMP/staging-cleanup-deployment-state.json"
          CLEANUP_DEADLINE=$(( $(date +%s) + 900 ))
          RESTORED=false
          RESTORE_SPEC="$BASELINE_SPEC"
          CLEANUP_DEPLOYMENT_ID=""
          attempt=0

          jq -S '.services = (.services // []) | .databases = (.databases // [])' \
            "$BASELINE_SPEC" > "$NORMAL_BASELINE"
          while [ "$(date +%s)" -lt "$CLEANUP_DEADLINE" ]; do
            attempt=$((attempt + 1))
            if ! timeout --foreground --signal=TERM --kill-after=5s 30s \
              doctl apps spec get "$DO_APP_ID" --format json > "$CURRENT_SPEC"; then
              echo "Cleanup attempt $attempt could not fetch the live spec; retrying."
              sleep 15
              continue
            fi

            node .github/scripts/temporary_staging_spec.js \
              cleanup "$CURRENT_SPEC" "$CLEANED_SPEC" \
              "$DO_APP_NAME" "$DO_SERVICE" "$DO_DATABASE" "$DO_STATIC_SITE" \
              "$DO_REPO" "$DO_BRANCH" "https://$DO_APP_HOST" "$DO_MARKER"

            jq -S '.services = (.services // []) | .databases = (.databases // [])' \
              "$CLEANED_SPEC" > "$NORMAL_CLEANED"
            if cmp -s "$NORMAL_BASELINE" "$NORMAL_CLEANED"; then
              RESTORE_SPEC="$BASELINE_SPEC"
            else
              RESTORE_SPEC="$CLEANED_SPEC"
              echo "The live app changed outside the temporary components; cleanup will preserve the current live fields."
            fi
            jq -S . "$CURRENT_SPEC" > "$NORMAL_CURRENT"
            jq -S . "$CLEANED_SPEC" > "$NORMAL_CLEANED"
            if cmp -s "$NORMAL_CURRENT" "$NORMAL_CLEANED"; then
              RESTORED=true
              break
            fi

            if timeout --foreground --signal=TERM --kill-after=5s 60s \
              doctl apps propose --app "$DO_APP_ID" --spec "$RESTORE_SPEC" >/dev/null && \
               timeout --foreground --signal=TERM --kill-after=10s 120s \
              doctl apps update "$DO_APP_ID" \
                --spec "$RESTORE_SPEC" \
                --format ID,DefaultIngress,Updated; then
              echo "Cleanup attempt $attempt submitted the safe resource-removal spec."
            else
              STATUS=$?
              echo "Cleanup attempt $attempt could not submit deletion yet (exit $STATUS); retrying within the reserved window."
            fi
            sleep 15
          done
          if [ "$RESTORED" != "true" ]; then
            echo "::error::Temporary resource deletion did not converge within the reserved cleanup window. The independent cleanup job will retry."
            exit 1
          fi

          doctl apps spec get "$DO_APP_ID" --format json > "$POST_SPEC"
          if ! jq -e --arg service "$DO_SERVICE" --arg database "$DO_DATABASE" \
            --arg site "$DO_STATIC_SITE" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
              (all(.services[]?; .name != $service)) and
              (all(.databases[]?; .name != $database)) and
              (all(.ingress.rules[]?; (.component.name // "") != $service)) and
              (([.static_sites[]? | select(.name == $site and .github.repo == $repo and
                .github.branch == $branch and .github.deploy_on_push == true)] | length) == 1)
            ' "$POST_SPEC" >/dev/null; then
            echo "::error::Post-cleanup inventory still contains a temporary resource. It may still be billing."
            exit 1
          fi

          EXPECTED_VERSION="$(jq -r '.v' docs/app/version.json)"
          EXPECTED_LANDING_SHA="$(sha256sum docs/index.html | awk '{print $1}')"
          EXPECTED_APP_SHA="$(sha256sum docs/app/index.html | awk '{print $1}')"
          while [ "$(date +%s)" -lt "$CLEANUP_DEADLINE" ]; do
            ACTIVE_CLEANUP="false"
            if timeout --foreground --signal=TERM --kill-after=5s 30s \
              doctl apps get "$DO_APP_ID" --output json > "$APP_STATE_FILE" 2>/dev/null; then
              ACTIVE_CLEANUP="$(jq -r --arg id "$DO_APP_ID" --arg service "$DO_SERVICE" \
                --arg cleanup "$CLEANUP_DEPLOYMENT_ID" '
                ([.[0] | select(.id == $id) |
                  select($cleanup != "") |
                  select(.active_deployment.id == $cleanup and
                    .active_deployment.phase == "ACTIVE") |
                  select(all(.active_deployment.services[]?; .name != $service)) |
                  select(.in_progress_deployment == null and .pending_deployment == null)] | length) == 1
              ' "$APP_STATE_FILE")"
            fi
            VERSION="$(curl -fsSL --max-time 5 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/app/version.json?cleanup=$GITHUB_RUN_ID" \
              2>/dev/null | jq -r '.v // empty' 2>/dev/null || true)"
            LANDING_SHA="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/?cleanup=$GITHUB_RUN_ID" 2>/dev/null | sha256sum | awk '{print $1}' || true)"
            APP_SHA="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/app/?cleanup=$GITHUB_RUN_ID" 2>/dev/null | sha256sum | awk '{print $1}' || true)"
            API_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              -H 'Cache-Control: no-cache' "https://$DO_APP_HOST/api/health?cleanup=$GITHUB_RUN_ID" || true)"
            if [ "$VERSION" = "$EXPECTED_VERSION" ] && \
               [ "$LANDING_SHA" = "$EXPECTED_LANDING_SHA" ] && \
               [ "$APP_SHA" = "$EXPECTED_APP_SHA" ] && [ "$API_STATUS" = "404" ] && \
               [ "$ACTIVE_CLEANUP" = "true" ]; then
              echo "Cleanup verified: staging is static-only again; Web is intact; temporary API and database are removed."
              exit 0
            fi

            if [ -n "$CLEANUP_DEPLOYMENT_ID" ] && \
               timeout --foreground --signal=TERM --kill-after=5s 30s \
                 doctl apps get-deployment "$DO_APP_ID" "$CLEANUP_DEPLOYMENT_ID" \
                   --output json > "$CLEANUP_DEPLOYMENT_STATE_FILE" 2>/dev/null; then
              CLEANUP_PHASE="$(jq -r '
                (if type == "array" then .[0] else . end) | .phase // empty
              ' "$CLEANUP_DEPLOYMENT_STATE_FILE" 2>/dev/null || true)"
              CLEANUP_ERRORS="$(jq -r '
                (if type == "array" then .[0] else . end) | .progress.error_steps // 0
              ' "$CLEANUP_DEPLOYMENT_STATE_FILE" 2>/dev/null || echo 0)"
              if [[ "$CLEANUP_PHASE" =~ ^(ERROR|CANCELED|SUPERSEDED)$ ]] || \
                 [ "$CLEANUP_ERRORS" -gt 0 ]; then
                echo "Cleanup deployment $CLEANUP_DEPLOYMENT_ID ended as $CLEANUP_PHASE; creating a new clean deployment."
                CLEANUP_DEPLOYMENT_ID=""
              else
                echo "Cleanup deployment $CLEANUP_DEPLOYMENT_ID is $CLEANUP_PHASE; continuing to poll it."
              fi
            fi

            if [ -z "$CLEANUP_DEPLOYMENT_ID" ] && \
               [ $(( CLEANUP_DEADLINE - $(date +%s) )) -gt 30 ]; then
              echo "The desired spec is clean; creating one traceable static cleanup deployment."
              if timeout --foreground --signal=TERM --kill-after=5s 60s \
                doctl apps create-deployment "$DO_APP_ID" \
                  --force-rebuild \
                  --output json > "$CLEANUP_DEPLOYMENT_FILE"; then
                CREATED_ID="$(jq -r '
                  (if type == "array" then .[0] else . end) | .id // empty
                ' "$CLEANUP_DEPLOYMENT_FILE" 2>/dev/null || true)"
                if [ -n "$CREATED_ID" ]; then
                  CLEANUP_DEPLOYMENT_ID="$CREATED_ID"
                  echo "Created traceable cleanup deployment $CLEANUP_DEPLOYMENT_ID; polling until that exact ID is active."
                else
                  echo "Cleanup creation returned without a deployment ID; retrying."
                fi
              else
                STATUS=$?
                echo "Cleanup deployment could not be created yet (exit $STATUS); retrying."
              fi
            fi
            sleep 15
          done
          echo "::error::Cleanup inventory passed, but the restored static-only endpoint contract did not settle in time."
          exit 1

      - name: Confirm rerun recovery and revalidation
        if: steps.recover.outputs.recovered == 'true'
        shell: bash
        run: echo "This rerun removed the prior orphan, then completed a fresh validation and cleanup."

  cleanup:
    name: Independently enforce static-only staging
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DO_APP_NAME: hnk-ai-tools-2
      DO_APP_HOST: hnk-ai-tools-2-gibhz.ondigitalocean.app
      DO_REPO: hlaingkhay28047-svg/TG
      DO_BRANCH: upgrade-safe-wave
      DO_SERVICE: hnk-api
      DO_DATABASE: "hnk-tmp-${{ github.run_id }}"
      DO_STATIC_SITE: hnk-web
      DO_MARKER: "run-${{ github.run_id }}"
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_STAGING_ACCESS_TOKEN }}

    steps:
      - name: Check out the cleanup code from this run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the staging token for independent cleanup
        shell: bash
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::DIGITALOCEAN_STAGING_ACCESS_TOKEN is missing; independent cleanup cannot be verified."
            exit 1
          fi

      - name: Install doctl for independent cleanup
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ env.DO_TOKEN }}
          version: 1.166.0

      - name: Resolve the exact staging app
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          timeout --foreground --signal=TERM --kill-after=5s 30s \
            doctl apps list --output json > "$RUNNER_TEMP/cleanup-apps.json"
          APP_ID="$(jq -r --arg name "$DO_APP_NAME" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            .[]
            | select(.spec.name == $name)
            | select(any(.spec.static_sites[]?; .github.repo == $repo and .github.branch == $branch))
            | .id
          ' "$RUNNER_TEMP/cleanup-apps.json" | head -n 1)"
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::The exact staging app was not found for independent cleanup."
            exit 1
          fi
          echo "DO_APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Retry until resources are absent and static staging is intact
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          CURRENT_SPEC="$RUNNER_TEMP/independent-current.json"
          CLEANED_SPEC="$RUNNER_TEMP/independent-cleaned.json"
          NORMAL_CURRENT="$RUNNER_TEMP/independent-current-normalized.json"
          NORMAL_CLEANED="$RUNNER_TEMP/independent-cleaned-normalized.json"
          APP_STATE_FILE="$RUNNER_TEMP/independent-app-state.json"
          CLEANUP_DEPLOYMENT_FILE="$RUNNER_TEMP/independent-cleanup-deployment.json"
          CLEANUP_DEPLOYMENT_STATE_FILE="$RUNNER_TEMP/independent-cleanup-deployment-state.json"
          EXPECTED_VERSION="$(jq -r '.v' docs/app/version.json)"
          EXPECTED_LANDING_SHA="$(sha256sum docs/index.html | awk '{print $1}')"
          EXPECTED_APP_SHA="$(sha256sum docs/app/index.html | awk '{print $1}')"
          DEADLINE=$(( $(date +%s) + 1200 ))
          CLEANUP_DEPLOYMENT_ID=""
          attempt=0

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            attempt=$((attempt + 1))
            if ! timeout --foreground --signal=TERM --kill-after=5s 30s \
              doctl apps spec get "$DO_APP_ID" --format json > "$CURRENT_SPEC"; then
              echo "Independent cleanup attempt $attempt could not fetch the live spec; retrying."
              sleep 15
              continue
            fi

            node .github/scripts/temporary_staging_spec.js \
              cleanup "$CURRENT_SPEC" "$CLEANED_SPEC" \
              "$DO_APP_NAME" "$DO_SERVICE" "$DO_DATABASE" "$DO_STATIC_SITE" \
              "$DO_REPO" "$DO_BRANCH" "https://$DO_APP_HOST" "$DO_MARKER"
            jq -S . "$CURRENT_SPEC" > "$NORMAL_CURRENT"
            jq -S . "$CLEANED_SPEC" > "$NORMAL_CLEANED"

            if ! cmp -s "$NORMAL_CURRENT" "$NORMAL_CLEANED"; then
              if timeout --foreground --signal=TERM --kill-after=5s 60s \
                doctl apps propose --app "$DO_APP_ID" --spec "$CLEANED_SPEC" >/dev/null && \
                 timeout --foreground --signal=TERM --kill-after=10s 120s \
                doctl apps update "$DO_APP_ID" \
                  --spec "$CLEANED_SPEC" \
                  --format ID,DefaultIngress,Updated; then
                echo "Independent cleanup attempt $attempt submitted resource deletion."
              else
                STATUS=$?
                echo "Independent cleanup attempt $attempt could not submit deletion yet (exit $STATUS); retrying."
              fi
              sleep 15
              continue
            fi

            if ! jq -e --arg service "$DO_SERVICE" --arg database "$DO_DATABASE" \
              --arg site "$DO_STATIC_SITE" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
                (all(.services[]?; .name != $service)) and
                (all(.databases[]?; .name != $database)) and
                (all(.ingress.rules[]?; (.component.name // "") != $service)) and
                (([.static_sites[]? | select(.name == $site and .github.repo == $repo and
                  .github.branch == $branch and .github.deploy_on_push == true)] | length) == 1)
              ' "$CURRENT_SPEC" >/dev/null; then
              echo "::error::A temporary component remains after a semantically clean transform."
              exit 1
            fi

            ACTIVE_CLEANUP="false"
            if timeout --foreground --signal=TERM --kill-after=5s 30s \
              doctl apps get "$DO_APP_ID" --output json > "$APP_STATE_FILE" 2>/dev/null; then
              ACTIVE_CLEANUP="$(jq -r --arg id "$DO_APP_ID" --arg service "$DO_SERVICE" \
                --arg cleanup "$CLEANUP_DEPLOYMENT_ID" '
                ([.[0] | select(.id == $id) |
                  select($cleanup != "") |
                  select(.active_deployment.id == $cleanup and
                    .active_deployment.phase == "ACTIVE") |
                  select(all(.active_deployment.services[]?; .name != $service)) |
                  select(.in_progress_deployment == null and .pending_deployment == null)] | length) == 1
              ' "$APP_STATE_FILE")"
            fi
            VERSION="$(curl -fsSL --max-time 5 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/app/version.json?independent-cleanup=$GITHUB_RUN_ID&attempt=$attempt" \
              2>/dev/null | jq -r '.v // empty' 2>/dev/null || true)"
            LANDING_SHA="$(curl -fsSL --max-time 10 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/?independent-cleanup=$GITHUB_RUN_ID&attempt=$attempt" \
              2>/dev/null | sha256sum | awk '{print $1}' || true)"
            APP_SHA="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/app/?independent-cleanup=$GITHUB_RUN_ID&attempt=$attempt" \
              2>/dev/null | sha256sum | awk '{print $1}' || true)"
            API_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "https://$DO_APP_HOST/api/health?independent-cleanup=$GITHUB_RUN_ID&attempt=$attempt" || true)"
            if [ "$VERSION" = "$EXPECTED_VERSION" ] && \
               [ "$LANDING_SHA" = "$EXPECTED_LANDING_SHA" ] && \
               [ "$APP_SHA" = "$EXPECTED_APP_SHA" ] && [ "$API_STATUS" = "404" ] && \
               [ "$ACTIVE_CLEANUP" = "true" ]; then
              echo "Independent cleanup verified: staging is static-only, Web is intact, and no temporary resource remains."
              exit 0
            fi

            if [ -n "$CLEANUP_DEPLOYMENT_ID" ] && \
               timeout --foreground --signal=TERM --kill-after=5s 30s \
                 doctl apps get-deployment "$DO_APP_ID" "$CLEANUP_DEPLOYMENT_ID" \
                   --output json > "$CLEANUP_DEPLOYMENT_STATE_FILE" 2>/dev/null; then
              CLEANUP_PHASE="$(jq -r '
                (if type == "array" then .[0] else . end) | .phase // empty
              ' "$CLEANUP_DEPLOYMENT_STATE_FILE" 2>/dev/null || true)"
              CLEANUP_ERRORS="$(jq -r '
                (if type == "array" then .[0] else . end) | .progress.error_steps // 0
              ' "$CLEANUP_DEPLOYMENT_STATE_FILE" 2>/dev/null || echo 0)"
              if [[ "$CLEANUP_PHASE" =~ ^(ERROR|CANCELED|SUPERSEDED)$ ]] || \
                 [ "$CLEANUP_ERRORS" -gt 0 ]; then
                echo "Independent cleanup deployment $CLEANUP_DEPLOYMENT_ID ended as $CLEANUP_PHASE; creating a replacement."
                CLEANUP_DEPLOYMENT_ID=""
              else
                echo "Independent cleanup deployment $CLEANUP_DEPLOYMENT_ID is $CLEANUP_PHASE; continuing to poll it."
              fi
            fi

            if [ -z "$CLEANUP_DEPLOYMENT_ID" ] && \
               [ $(( DEADLINE - $(date +%s) )) -gt 30 ]; then
              echo "Independent cleanup attempt $attempt is creating one traceable clean deployment."
              if timeout --foreground --signal=TERM --kill-after=5s 60s \
                doctl apps create-deployment "$DO_APP_ID" \
                  --force-rebuild \
                  --output json > "$CLEANUP_DEPLOYMENT_FILE"; then
                CREATED_ID="$(jq -r '
                  (if type == "array" then .[0] else . end) | .id // empty
                ' "$CLEANUP_DEPLOYMENT_FILE" 2>/dev/null || true)"
                if [ -n "$CREATED_ID" ]; then
                  CLEANUP_DEPLOYMENT_ID="$CREATED_ID"
                  echo "Created independent cleanup deployment $CLEANUP_DEPLOYMENT_ID; polling that exact ID."
                else
                  echo "Independent cleanup creation returned without a deployment ID; retrying."
                fi
              else
                STATUS=$?
                echo "Independent cleanup deployment could not be created yet (exit $STATUS); retrying."
              fi
            fi
            sleep 15
          done

          echo "::error::Independent cleanup did not prove a static-only app before its deadline. Temporary resources may still be billing."
          exit 1
