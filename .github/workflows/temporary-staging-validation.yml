name: Temporary DigitalOcean Build Log Diagnostic

on:
  push:
    branches: [upgrade-safe-wave]
    paths:
      - .github/workflows/temporary-staging-validation.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Read failed temporary API build logs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_STAGING_ACCESS_TOKEN }}
      DO_APP_ID: 29c33f72-2946-4a2a-8434-161a3bb5ba7d
      DO_DEPLOYMENT_ID: 6f82cc11-2684-4c1e-859e-640d2620cd5b
      DO_COMPONENT: hnk-api
    steps:
      - name: Require the staging token
        shell: bash
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::DIGITALOCEAN_STAGING_ACCESS_TOKEN is missing."
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ env.DO_TOKEN }}
          version: 1.166.0

      - name: Read the failed deployment summary
        shell: bash
        run: |
          set -euo pipefail
          doctl apps get-deployment "$DO_APP_ID" "$DO_DEPLOYMENT_ID" --output json |
            jq 'if type == "array" then .[0] else . end | {id, phase, progress}'

      - name: Read the failed API build logs
        shell: bash
        run: |
          set -euo pipefail
          doctl apps logs "$DO_APP_ID" "$DO_COMPONENT" \
            --type build \
            --deployment "$DO_DEPLOYMENT_ID" \
            --tail -1
