# Generate the studio's OWN card art and preset thumbnails on RunningHub (task #112, Imagine).
#
# WHY A WORKFLOW: the maintenance container has no egress to runninghub.ai and this
# public repository must never carry the Enterprise key (same story as
# probe-video-models.yml). The key comes from the RUNNINGHUB_KEY secret (or, as a
# fallback, a masked dispatch input), lives only in this run's environment, and is
# never written to a file, artifact or output.
#
# WHAT IT SPENDS: exactly the jobs listed in the checked-in jobs file (tools/…json),
# one task each, on the model each job names.
#
# HOW THE PICTURES COME BACK: run #1 printed 55 pictures as base64 into the job log —
# ~55 MB the log API could not hand back to the container, and the log/artifact download
# hosts are not reachable from it. So the run now writes the pictures to art_out/ and
# publishes that directory on a scratch branch, art/<run id>, with the workflow's own
# token; the container git-fetches it, finishes the art, and deletes the branch. The
# scratch branch carries generated pictures and a summary (task ids, byte counts) only —
# never the key, never a change to the product tree.
name: Generate card art on RunningHub
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ART to run'
        required: true
      rh_key:
        description: 'LEAVE EMPTY if the RUNNINGHUB_KEY secret exists. A key typed here is visible on this public run page — only as a fallback, then rotate it.'
        required: false
        default: ''
      jobs:
        description: 'path of the jobs file (default tools/imagine_art_jobs.json)'
        required: false
        default: 'tools/imagine_art_jobs.json'
      only:
        description: 'optional comma-separated job names to run (empty = every job in the file)'
        required: false
        default: ''
      delete_branch:
        description: 'cleanup only: name of a scratch branch (art/<run id>) to delete — runs no jobs, needs no key'
        required: false
        default: ''
permissions:
  contents: write   # the scratch art/<run id> branch (see the header); nothing else is written
concurrency:
  group: gen-art
  cancel-in-progress: false
jobs:
  cleanup:
    if: ${{ inputs.delete_branch != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the scratch branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BR: ${{ inputs.delete_branch }}
        run: |
          case "$BR" in art/*) ;; *) echo "only art/<run id> branches are deleted here"; exit 1;; esac
          git init -q scratch && cd scratch
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" --delete "refs/heads/${BR}"
          echo "deleted refs/heads/${BR}"
  art:
    if: ${{ inputs.confirm == 'ART' && inputs.delete_branch == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Generate
        env:
          RH_KEY: ${{ secrets.RUNNINGHUB_KEY != '' && secrets.RUNNINGHUB_KEY || inputs.rh_key }}
          JOBS: ${{ inputs.jobs }}
          ONLY: ${{ inputs.only }}
          ART_OUT: art_out
          ART_PRINT: "0"
        run: |
          if [ -z "$RH_KEY" ]; then echo "no key: add the RUNNINGHUB_KEY secret or pass rh_key"; exit 1; fi
          echo "::add-mask::$RH_KEY"
          node tools/rh_art_gen.js "$JOBS" "$ONLY"
      - name: Publish the pictures on a scratch branch (art/<run id>)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -d art_out ] || [ -z "$(ls -A art_out)" ]; then echo "nothing to publish"; exit 0; fi
          ls -la art_out | head -80
          BR="art/${GITHUB_RUN_ID}"
          git config user.name "hnk-art-lane"
          git config user.email "art-lane@users.noreply.github.com"
          git checkout --orphan "$BR" >/dev/null 2>&1
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f art_out
          git -c commit.gpgsign=false commit -q -m "art: pictures from gen-art run ${GITHUB_RUN_ID} (generated on RunningHub; scratch branch, deleted after the container fetches it)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BR}"
          echo "published refs/heads/${BR} ($(ls art_out | wc -l) files)"
