# Generate the studio's OWN card art and preset thumbnails on RunningHub (task #112, Imagine).
#
# WHY A WORKFLOW: the maintenance container has no egress to runninghub.ai and this
# public repository must never carry the Enterprise key (same story as
# probe-video-models.yml). The key comes from the RUNNINGHUB_KEY secret (or, as a
# fallback, a masked dispatch input), lives only in this run's environment, and is
# never written to a file, artifact or output.
#
# WHAT IT SPENDS: exactly the jobs listed in the checked-in jobs file (tools/…json),
# one task each, on the model each job names. The results are printed as base64
# between ===== ART <name> ===== markers; the container decodes them, resizes
# them and commits the finished art. Nothing is written to the repo by the run.
name: Generate card art on RunningHub
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ART to run'
        required: true
      rh_key:
        description: 'LEAVE EMPTY if the RUNNINGHUB_KEY secret exists. A key typed here is visible on this public run page — only as a fallback, then rotate it.'
        required: false
        default: ''
      jobs:
        description: 'path of the jobs file (default tools/imagine_art_jobs.json)'
        required: false
        default: 'tools/imagine_art_jobs.json'
      only:
        description: 'optional comma-separated job names to run (empty = every job in the file)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: gen-art
  cancel-in-progress: false
jobs:
  art:
    if: ${{ inputs.confirm == 'ART' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Generate
        env:
          RH_KEY: ${{ secrets.RUNNINGHUB_KEY != '' && secrets.RUNNINGHUB_KEY || inputs.rh_key }}
          JOBS: ${{ inputs.jobs }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -z "$RH_KEY" ]; then echo "no key: add the RUNNINGHUB_KEY secret or pass rh_key"; exit 1; fi
          echo "::add-mask::$RH_KEY"
          node tools/rh_art_gen.js "$JOBS" "$ONLY"
