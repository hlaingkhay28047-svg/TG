name: Cross-engine sweep (WebKit + Firefox)

# v6.27.0 — the studio is used from iPhones (WebKit) and from Firefox on
# desktops, yet every browser test in test/ opens Chromium. This lane runs the
# layout / behaviour tests that need only the served web app on the other two
# engines, unchanged: test/_engine.js is preloaded and swaps
# require("playwright").chromium for the engine named in HNK_ENGINE.
# Runs on every pull request and on main, beside test.yml; dispatch takes a custom list.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tests:
        description: "space-separated test basenames (empty = the fixed list below)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  engine:
    name: ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Playwright + ${{ matrix.engine }}
        run: |
          npm install playwright@1.62.1
          ./node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}

      - name: Serve docs/app
        # WebKit upgrades loopback http to https under the app's upgrade-insecure-requests
        # policy (Chromium and Firefox treat 127.0.0.1 as potentially trustworthy and leave
        # it alone, as the Secure Contexts spec says). Over https nothing listens, so sw.js,
        # the face worker and every fetch fail before a single layout check runs. The WebKit
        # leg therefore serves a COPY with that one directive removed; the source pins in each
        # test still read the untouched docs/app/index.html, and production is https anyway.
        run: |
          SERVE=docs/app
          if [ "${{ matrix.engine }}" = "webkit" ]; then
            mkdir -p /tmp/hnk-app && cp -r docs/app/. /tmp/hnk-app/
            sed -i 's/; upgrade-insecure-requests"/"/' /tmp/hnk-app/index.html
            grep -c "upgrade-insecure-requests" /tmp/hnk-app/index.html || true
            SERVE=/tmp/hnk-app
          fi
          (cd "$SERVE" && python3 -m http.server 8931 >/dev/null 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8931/index.html >/dev/null && break; sleep 1; done

      - name: Run the layout and behaviour tests on ${{ matrix.engine }}
        env:
          HNK_ENGINE: ${{ matrix.engine }}
          NODE_OPTIONS: --require ./test/_engine.js
          PORT: "8931"
          TESTS: ${{ inputs.tests }}
        run: |
          set +e
          # sweep_v535_rtl_lang serves the untouched docs tree itself and verify_landing_fill opens the
          # landing over file:// — both meet the same WebKit upgrade / file-fetch limits, so they run on
          # Firefox only; every other test runs on both engines.
          # verify_clean_stage is back on the WebKit leg (task #107). Run #2's "compact stage does not
          # restore on a scroll back to the top" was the read racing the engine, not the stage: WebKit
          # delivers a programmatic scroll's event only at its next rendering opportunity, 300–550 ms
          # later while the studio's hi-res preview tier is still rendering (diag run #17), and the test
          # read a fixed 350 ms after scrolling. The test now waits for the reaction (the exit fires
          # within ~50 ms once the thread is idle, 16/16 cycles). Its second finding — the GENERATE
          # button not filling its row with the queue open — has not reproduced since the 6.27.0
          # service-worker block (runs #14–#17); the diag measured the same flex geometry as Chromium.
          if [ "$HNK_ENGINE" = "webkit" ]; then
            LIST="${TESTS:-verify_tabbar_reachable verify_clean_stage verify_native_pick verify_slot_whole_photo verify_freeform_slots verify_desktop_fill sweep_v492_gridfit sweep_v528_safearea sweep_v533_a11y}"
          else
            LIST="${TESTS:-verify_tabbar_reachable verify_clean_stage verify_native_pick verify_slot_whole_photo verify_freeform_slots verify_desktop_fill sweep_v492_gridfit sweep_v528_safearea sweep_v533_a11y sweep_v535_rtl_lang verify_landing_fill}"
          fi
          failed=""
          for t in $LIST; do
            echo "::group::$t on $HNK_ENGINE"
            timeout 900 node test/$t.js; rc=$?
            echo "::endgroup::"
            echo "== $t rc=$rc"
            [ $rc -eq 0 ] || failed="$failed $t"
          done
          echo "===CROSS-ENGINE $HNK_ENGINE failed:${failed:- none}==="
          [ -z "$failed" ]
