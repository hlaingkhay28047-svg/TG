name: Set production SMTP settings

# WHY THIS EXISTS. The signup-notice and password-reset mailer is complete in
# the service and waits on four environment variables. This repository is
# public, so the Gmail app password must never be a workflow input, a commit,
# or a log line. The owner stores SMTP_USER and SMTP_PASS as GitHub repository
# secrets (Settings -> Secrets and variables -> Actions); this lane maps them
# into the environment, patches the live App Platform spec through
# .github/scripts/set_smtp_secrets.js — which validates without echoing and
# is itself pinned by test/verify_smtp_secrets_patch.js — reads the spec
# back, and then waits for /api/health to report smtpConfigured true on the
# redeployed service. Output names keys and byte lengths only.
#
# MANUAL, AND GUARDED: never on a push, and the word SMTP must be typed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SMTP to write the mail settings to production"
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: digitalocean-production-secrets
  cancel-in-progress: false

jobs:
  smtp:
    name: Write the SMTP settings to hnk-api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DO_APP_NAME: hnk-ai-tools-3
      DO_REPO: hlaingkhay28047-svg/TG
      DO_BRANCH: main
      DO_SERVICE: hnk-api
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_PRODUCTION_ACCESS_TOKEN }}
      # Through the environment, never interpolated into scripts.
      CONFIRM_INPUT: ${{ inputs.confirm }}
      SMTP_USER_VALUE: ${{ secrets.SMTP_USER }}
      SMTP_PASS_VALUE: ${{ secrets.SMTP_PASS }}
    steps:
      - name: Require the typed confirmation, the token, and both mail secrets
        shell: bash
        run: |
          if [ "$CONFIRM_INPUT" != "SMTP" ]; then
            echo "::error::Refusing to change production mail settings without the typed confirmation SMTP."
            exit 1
          fi
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::This lane requires DIGITALOCEAN_PRODUCTION_ACCESS_TOKEN."
            exit 1
          fi
          if [ -z "$SMTP_USER_VALUE" ] || [ -z "$SMTP_PASS_VALUE" ]; then
            echo "::error::Add SMTP_USER and SMTP_PASS as repository secrets first (Settings -> Secrets and variables -> Actions), then dispatch again."
            exit 1
          fi
          echo "::add-mask::$SMTP_USER_VALUE"
          echo "::add-mask::$SMTP_PASS_VALUE"

      - name: Check out the patch script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1
        with:
          persist-credentials: false

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ env.DO_TOKEN }}
          version: 1.166.0

      - name: Write the SMTP settings into the live spec
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          APPS_FILE="$RUNNER_TEMP/smtp-apps.json"
          LIVE_SPEC="$RUNNER_TEMP/smtp-live.json"
          PATCHED_SPEC="$RUNNER_TEMP/smtp-patched.json"
          VERIFY_SPEC="$RUNNER_TEMP/smtp-verify.json"
          # The patched spec holds the plaintext credential until DigitalOcean
          # has it. Remove it on every exit path, successful or not.
          trap 'rm -f "$APPS_FILE" "$LIVE_SPEC" "$PATCHED_SPEC" "$VERIFY_SPEC"' EXIT

          doctl apps list --output json > "$APPS_FILE"
          APP_COUNT="$(jq -r --arg name "$DO_APP_NAME" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            [.[]
              | select(.spec.name == $name)
              | select(any(.spec.static_sites[]?;
                  .github.repo == $repo and .github.branch == $branch))]
            | length
          ' "$APPS_FILE")"
          if [ "$APP_COUNT" -ne 1 ]; then
            echo "::error::Refusing to write settings to an ambiguous production app selection."
            exit 1
          fi
          APP_ID="$(jq -r --arg name "$DO_APP_NAME" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            .[]
            | select(.spec.name == $name)
            | select(any(.spec.static_sites[]?;
                .github.repo == $repo and .github.branch == $branch))
            | .id
          ' "$APPS_FILE")"

          doctl apps spec get "$APP_ID" --format json > "$LIVE_SPEC"
          node .github/scripts/set_smtp_secrets.js \
            "$LIVE_SPEC" "$PATCHED_SPEC" "$DO_SERVICE"

          # --update-sources is deliberately absent: this changes configuration,
          # not which commit is deployed.
          doctl apps update "$APP_ID" --spec "$PATCHED_SPEC" \
            --format ID,DefaultIngress,Updated
          rm -f "$PATCHED_SPEC"

          # READ IT BACK: the four names must exist on the service. Values come
          # back platform-encrypted or plain config; only names are printed.
          doctl apps spec get "$APP_ID" --format json > "$VERIFY_SPEC"
          MISSING=""
          for KEY in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS; do
            FOUND="$(jq -r --arg service "$DO_SERVICE" --arg key "$KEY" '
              [.services[]? | select(.name == $service) | .envs[]? | select(.key == $key)] | length
            ' "$VERIFY_SPEC")"
            if [ "$FOUND" != "1" ]; then MISSING="$MISSING $KEY"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::The platform did not store:$MISSING"
            exit 1
          fi
          echo "All four SMTP settings are stored on $DO_SERVICE."

      - name: Wait for the service to report mail configured
        shell: bash
        run: |
          set -euo pipefail
          SMTP_OK=false
          for attempt in $(seq 1 36); do
            BODY="$(curl -fsS --max-time 15 "https://hnk-ai-tools-3-s4nnu.ondigitalocean.app/api/health" || true)"
            SMTP="$(printf '%s' "$BODY" | jq -r '.smtpConfigured // false' 2>/dev/null || echo false)"
            READY="$(printf '%s' "$BODY" | jq -r '.ready // false' 2>/dev/null || echo false)"
            echo "health ready=$READY smtpConfigured=$SMTP (check $attempt)"
            if [ "$SMTP" = "true" ] && [ "$READY" = "true" ]; then SMTP_OK=true; break; fi
            sleep 10
          done
          if [ "$SMTP_OK" != "true" ]; then
            echo "::error::The service has not reported smtpConfigured after six minutes — read the deployment in the DigitalOcean console."
            exit 1
          fi
          echo "The service is ready and reports its mailer configured."
