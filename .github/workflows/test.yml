name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sweep:
    name: Workflow sweep (mocked generate)
    runs-on: ubuntu-24.04

    # verify_schema_behaviour.js applies supabase/schema.sql to a real database
    # and attacks it. It deliberately does not skip when no server is present:
    # a schema test that quietly passes unreachable proves nothing, and the two
    # defects it caught (the file could not CREATE the tables it protects; the
    # device cap counted a re-registration as a new device) were both invisible
    # to every check that only reads the file.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify coordinated release and delivery contract
        run: node test/verify_release_contract.js

      - name: Verify unified account, license, device, admin, and Panel contracts
        run: |
          node test/verify_no_public_ccx.js
          node test/verify_unified_schema.js
          node test/verify_unified_backend_contract.js
          node test/verify_unified_security.js
          node test/verify_unified_api_contracts.js
          node test/verify_admin_payments.js
          node test/verify_unified_artifacts.js
          node test/verify_unified_auth_security.js
          node test/verify_unified_frontend.js
          node test/verify_unified_routes.js
          node test/verify_panel_unified_backend.js
          node test/verify_panel_manifest_permissions.js
          node test/verify_panel_catalog_sync.js
          node test/verify_spaces_client.js
          node test/verify_spaces_artifact_path.js

      - name: Verify Supabase RLS contract (every client table is protected)
        run: node test/verify_rls_contract.js

      - name: Install the PostgreSQL client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Verify roleless RLS under a restricted database owner
        run: node test/verify_roleless_rls.js

      # The production database was initialised in the old auth/storage dialect,
      # which platform.sql refuses rather than stranding the accounts in it.
      # This proves the migration that answers that refusal carries every row
      # across under the same restricted login App Platform connects with.
      - name: Verify the legacy auth/storage migration keeps every row
        run: node test/verify_legacy_dialect_migration.js

      - name: Verify the schema ENFORCES what it claims (real PostgreSQL)
        run: node test/verify_schema_behaviour.js

      # v5.48.0 — the profile photo column: bounded on the server, self-only
      # under RLS, and wired safely in the app. Attacks a real database.
      - name: Verify the profile avatar contract (real PostgreSQL)
        run: node test/verify_profile_avatar.js

      # v5.49.0 — the launch splash's guards and the work-in-progress
      # snapshot's four refusals, plus the shared IndexedDB upgrade path.
      - name: Verify the splash and work-in-progress contract
        run: node test/verify_splash_wip.js

      # landing glam: the social dock mirrors the contact row's real links,
      # the ghost wordmark stays decoration, and the Latin-only kick stagger
      # can never split a complex script.
      - name: Verify the landing glam contract
        run: node test/verify_landing_glam.js

      # verify_api_service.js boots the real service, which needs its one pinned
      # dependency. npm ci installs exactly what package-lock.json names, so CI
      # runs the same driver version that was tested.
      - name: Install the API service dependencies
        run: npm ci --omit=dev --prefix server

      # No account can promote itself to administrator, by design, so the FIRST
      # one has to be granted from inside the container. This proves that grant
      # only ever grants — clearing the variable must never be able to lock
      # every administrator out of a panel nothing else can reopen.
      #
      # It must run AFTER the install above: it drives the module with a real pg
      # client, exactly as migrate.js does, and pg is a server/ dependency.
      - name: Verify the first-administrator bootstrap grants and never revokes
        run: node test/verify_admin_bootstrap.js

      - name: Verify API liveness while the database migration is blocked
        run: node test/verify_api_liveness.js

      - name: Verify DigitalOcean live-spec patch is narrow and fail-closed
        run: node test/verify_digitalocean_spec_patch.js

      - name: Verify DigitalOcean staging bootstrap is narrow and fail-closed
        run: node test/verify_digitalocean_staging_bootstrap.js

      # This one edits the LIVE production spec, and the six security secrets
      # live in the same array it edits. Losing one is an outage that looks
      # like nothing until the next boot, so "every other variable survives
      # byte for byte" is asserted rather than assumed.
      - name: Verify the first-administrator spec patch touches one variable
        run: node test/verify_bootstrap_admin_patch.js

      # The SMTP lane edits the same live spec, from repository secrets in a
      # public repo: four names written, every other variable byte-for-byte,
      # and no path — success or refusal — that echoes a credential.
      - name: Verify the SMTP spec patch is narrow and never echoes a credential
        run: node test/verify_smtp_secrets_patch.js

      # The Spaces lane creates paid storage and a runtime credential from
      # the DigitalOcean API: four names written, everything else
      # byte-for-byte, the ephemeral key deleted on every exit path.
      - name: Verify the Spaces spec patch and setup lane never echo a key
        run: node test/verify_spaces_secrets_patch.js

      # The database-migration lane edits the same live spec, phase by phase.
      # Each phase must change exactly what it means and nothing else — the
      # cluster attach, the two binding flips, the guarded cleanup — with the
      # six encrypted secrets surviving every phase byte for byte.
      - name: Verify the database-migration spec phases are narrow and fail-closed
        run: node test/verify_database_migration_spec.js

      # The copier those phases deploy, against two real scratch databases as
      # the NOBYPASSRLS runtime role: schema applied, every row mirrored and
      # counted, triggers silenced during the mirror, re-runs refused.
      - name: Verify the dev-to-cluster database copier mirrors and refuses re-runs
        run: node test/verify_copy_database.js

      # The panel-release lane's SQL is applied once against production, so
      # its generator runs here against a real schema-carrying database as
      # the NOBYPASSRLS runtime role: artifact chunks verified byte-for-byte,
      # one latest, one minimum, refusals for every unpinned caller.
      - name: Verify the panel release lane publishes exactly the tracked artifact
        run: node test/verify_panel_release_workflow.js

      - name: Verify the API service end to end (real PostgreSQL)
        run: node test/verify_api_service.js

      - name: Install Playwright + Chromium
        run: |
          npm install playwright@1.62.1
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Serve docs/app
        run: |
          python3 -m http.server 8931 --directory docs/app &
          sleep 1

      - name: Run workflow sweep against docs/app/index.html
        run: node test/sweep_workflows.js

      - name: Run RunningHub Enterprise provider sweep (mocked)
        run: node test/sweep_runninghub.js

      - name: Run OpenAI provider sweep (mocked)
        run: node test/sweep_openai.js

      - name: Run cross-provider auto-fallback sweep (mocked)
        run: node test/sweep_fallback.js

      - name: Run RunningHub video-generation sweep (mocked)
        run: node test/sweep_video.js

      - name: Run RunningHub video-upscale sweep (mocked)
        run: node test/sweep_video_upscale.js

      - name: Run RunningHub text-to-image sweep (mocked)
        run: node test/sweep_text2img.js

      - name: Run update-available version-check regression test
        run: node test/verify_version_check.js

      - name: Run v4.13.0 full-app-upgrade regression sweep (mocked)
        run: node test/sweep_v413_upgrades.js

      - name: Run Retouch Studio sweep (mocked)
        run: node test/sweep_retouch_studio.js

