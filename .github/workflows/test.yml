name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sweep:
    name: Workflow sweep (mocked generate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Chromium
        run: |
          npm install playwright-core@1.62.1
          npx playwright install --with-deps chromium

      - name: Serve docs/app
        run: |
          python3 -m http.server 8931 --directory docs/app &
          sleep 1

      - name: Run workflow sweep against docs/app/index.html
        run: node test/sweep_workflows.js

      - name: Run RunningHub Enterprise provider sweep (mocked)
        run: node test/sweep_runninghub.js

      - name: Run OpenAI provider sweep (mocked)
        run: node test/sweep_openai.js

      - name: Run cross-provider auto-fallback sweep (mocked)
        run: node test/sweep_fallback.js

      - name: Run RunningHub video-generation sweep (mocked)
        run: node test/sweep_video.js

      - name: Run RunningHub video-upscale sweep (mocked)
        run: node test/sweep_video_upscale.js

      - name: Run RunningHub text-to-image sweep (mocked)
        run: node test/sweep_text2img.js

      - name: Run update-available version-check regression test
        run: node test/verify_version_check.js

      - name: Run v4.13.0 full-app-upgrade regression sweep (mocked)
        run: node test/sweep_v413_upgrades.js

      - name: Run Retouch Studio sweep (mocked)
        run: node test/sweep_retouch_studio.js

      - name: Run HNK V2 Retouch sweep (mocked)
        run: node test/sweep_hnk_v2.js

      - name: Verify bottom tab bar stays reachable on a real phone width
        run: node test/verify_tabbar_reachable.js

      - name: Verify network-failure errors are localized, not raw exceptions
        run: node test/verify_network_error_friendly.js

      - name: Verify Phase 1 UI/UX fixes (empty gen card, dropdown clipping)
        run: node test/verify_phase1_ui_fixes.js

      - name: Verify Phase 2 design-token scale (spacing/type/radius)
        run: node test/verify_phase2_design_tokens.js

      - name: Verify Phase 3 header + empty-state standardization
        run: node test/verify_phase3_header_emptystate.js

      - name: Verify Phase 4 Studio/Setup accordion conversion
        run: node test/verify_phase4_accordion.js

      - name: Verify Phase 5 nav regroup (4 top-level tabs, all pages reachable)
        run: node test/verify_phase5_nav_regroup.js

      - name: Verify Master BG FG Replace Smart Workflow
        run: node test/verify_master_bgfg_workflow.js

      - name: Run v4.27.0 Home (pgDash) + IA re-architecture sweep (mocked)
        run: node test/sweep_dash.js

      - name: Run Studio generate sweep (mocked)
        run: node test/sweep_studio_generate.js

      - name: Run Studio tiered live-preview + sticky-stage sweep (mocked)
        run: node test/sweep_studio_livepreview.js

      - name: Run v4.28.0 Pro Surfaces + Identity sweep (mocked)
        run: node test/sweep_v428_upgrades.js

      - name: Run v4.41.0 upgrade-wave sweep (mocked)
        run: node test/sweep_v441_upgrades.js

      - name: Run v4.42.0 Studio mega-wave sweep (mocked)
        run: node test/sweep_v442_upgrades.js

      - name: Run v4.43.0 language-upgrade sweep (mocked)
        run: node test/sweep_v443_upgrades.js

      - name: Run v4.44.0 Edit-pages Wave 1 sweep (mocked)
        run: node test/sweep_v444_upgrades.js

      - name: Run v4.45.0 Wave 3 + 880 style pack sweep (mocked)
        run: node test/sweep_v445_upgrades.js

      - name: Run v4.46.0 Wave 4a batch-scale sweep (mocked)
        run: node test/sweep_v446_upgrades.js

      - name: Run v4.47.0 Retouch mouth-lock + body sweep (mocked)
        run: node test/sweep_v447_upgrades.js

      - name: Run v4.48.0 880-pack combo-composer sweep (mocked)
        run: node test/sweep_v448_upgrades.js

      - name: Run v4.49.0 RH model-routing honesty sweep (mocked)
        run: node test/sweep_v449_upgrades.js

      - name: Run Path Retouch batch-look sweep (mocked)
        run: node test/sweep_path.js

      - name: Run v4.30.0 Accounts + Premium sweep (mocked)
        run: node test/sweep_account.js

      - name: Run Visual Library set-browse sweep (mocked)
        run: node test/sweep_library.js

      - name: Run Studio control-honesty sweep (mocked)
        run: node test/sweep_studio_fixes.js
