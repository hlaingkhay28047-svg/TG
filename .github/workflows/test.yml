name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sweep:
    name: Workflow sweep (mocked generate)
    runs-on: ubuntu-24.04

    # verify_schema_behaviour.js applies supabase/schema.sql to a real database
    # and attacks it. It deliberately does not skip when no server is present:
    # a schema test that quietly passes unreachable proves nothing, and the two
    # defects it caught (the file could not CREATE the tables it protects; the
    # device cap counted a re-registration as a new device) were both invisible
    # to every check that only reads the file.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify coordinated release and delivery contract
        run: node test/verify_release_contract.js

      - name: Verify unified account, license, device, admin, and Panel contracts
        run: |
          node test/verify_no_public_ccx.js
          node test/verify_unified_schema.js
          node test/verify_unified_backend_contract.js
          node test/verify_unified_security.js
          node test/verify_unified_api_contracts.js
          node test/verify_admin_payments.js
          node test/verify_unified_artifacts.js
          node test/verify_unified_auth_security.js
          node test/verify_unified_frontend.js
          node test/verify_unified_routes.js
          node test/verify_panel_unified_backend.js
          node test/verify_panel_manifest_permissions.js
          node test/verify_panel_catalog_sync.js
          node test/verify_spaces_client.js
          node test/verify_spaces_artifact_path.js

      - name: Verify Supabase RLS contract (every client table is protected)
        run: node test/verify_rls_contract.js

      - name: Install the PostgreSQL client
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Verify roleless RLS under a restricted database owner
        run: node test/verify_roleless_rls.js

      # The production database was initialised in the old auth/storage dialect,
      # which platform.sql refuses rather than stranding the accounts in it.
      # This proves the migration that answers that refusal carries every row
      # across under the same restricted login App Platform connects with.
      - name: Verify the legacy auth/storage migration keeps every row
        run: node test/verify_legacy_dialect_migration.js

      - name: Verify the schema ENFORCES what it claims (real PostgreSQL)
        run: node test/verify_schema_behaviour.js

      # v5.48.0 — the profile photo column: bounded on the server, self-only
      # under RLS, and wired safely in the app. Attacks a real database.
      - name: Verify the profile avatar contract (real PostgreSQL)
        run: node test/verify_profile_avatar.js

      # v5.49.0 — the launch splash's guards and the work-in-progress
      # snapshot's four refusals, plus the shared IndexedDB upgrade path.
      - name: Verify the splash and work-in-progress contract
        run: node test/verify_splash_wip.js

      # landing glam: the social dock mirrors the contact row's real links,
      # the ghost wordmark stays decoration, and the Latin-only kick stagger
      # can never split a complex script.
      - name: Verify the landing glam contract
        run: node test/verify_landing_glam.js

      # verify_api_service.js boots the real service, which needs its one pinned
      # dependency. npm ci installs exactly what package-lock.json names, so CI
      # runs the same driver version that was tested.
      - name: Install the API service dependencies
        run: npm ci --omit=dev --prefix server

      # No account can promote itself to administrator, by design, so the FIRST
      # one has to be granted from inside the container. This proves that grant
      # only ever grants — clearing the variable must never be able to lock
      # every administrator out of a panel nothing else can reopen.
      #
      # It must run AFTER the install above: it drives the module with a real pg
      # client, exactly as migrate.js does, and pg is a server/ dependency.
      - name: Verify the first-administrator bootstrap grants and never revokes
        run: node test/verify_admin_bootstrap.js

      - name: Verify API liveness while the database migration is blocked
        run: node test/verify_api_liveness.js

      # Same reason as the two steps above: this one boots the real API to read
      # the security headers off a live response, so it must run AFTER the
      # install — server/lib/db.js requires pg, and a server that cannot load
      # its driver never reaches listen().
      - name: Verify the production safety nets (live security headers, backup lane)
        run: node test/verify_production_safety.js

      - name: Verify DigitalOcean live-spec patch is narrow and fail-closed
        run: node test/verify_digitalocean_spec_patch.js

      - name: Verify DigitalOcean staging bootstrap is narrow and fail-closed
        run: node test/verify_digitalocean_staging_bootstrap.js

      # This one edits the LIVE production spec, and the six security secrets
      # live in the same array it edits. Losing one is an outage that looks
      # like nothing until the next boot, so "every other variable survives
      # byte for byte" is asserted rather than assumed.
      - name: Verify the first-administrator spec patch touches one variable
        run: node test/verify_bootstrap_admin_patch.js

      # The SMTP lane edits the same live spec, from repository secrets in a
      # public repo: four names written, every other variable byte-for-byte,
      # and no path — success or refusal — that echoes a credential.
      - name: Verify the SMTP spec patch is narrow and never echoes a credential
        run: node test/verify_smtp_secrets_patch.js

      # The Spaces lane creates paid storage and a runtime credential from
      # the DigitalOcean API: four names written, everything else
      # byte-for-byte, the ephemeral key deleted on every exit path.
      - name: Verify the Spaces spec patch and setup lane never echo a key
        run: node test/verify_spaces_secrets_patch.js

      # The database-migration lane edits the same live spec, phase by phase.
      # Each phase must change exactly what it means and nothing else — the
      # cluster attach, the two binding flips, the guarded cleanup — with the
      # six encrypted secrets surviving every phase byte for byte.
      - name: Verify the database-migration spec phases are narrow and fail-closed
        run: node test/verify_database_migration_spec.js

      # The copier those phases deploy, against two real scratch databases as
      # the NOBYPASSRLS runtime role: schema applied, every row mirrored and
      # counted, triggers silenced during the mirror, re-runs refused.
      - name: Verify the dev-to-cluster database copier mirrors and refuses re-runs
        run: node test/verify_copy_database.js

      # The panel-release lane's SQL is applied once against production, so
      # its generator runs here against a real schema-carrying database as
      # the NOBYPASSRLS runtime role: artifact chunks verified byte-for-byte,
      # one latest, one minimum, refusals for every unpinned caller.
      - name: Verify the panel release lane publishes exactly the tracked artifact
        run: node test/verify_panel_release_workflow.js

      - name: Verify the API service end to end (real PostgreSQL)
        run: node test/verify_api_service.js

      - name: Install Playwright + Chromium
        run: |
          npm install playwright@1.62.1
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Serve docs/app
        run: |
          python3 -m http.server 8931 --directory docs/app &
          sleep 1

      - name: Verify the panel Smart Workflow catalog tracks the web app exactly
        run: node test/verify_panel_wf_catalog_sync.js

      # v6.51.0 — the panel's Retouch A / Retouch B / Retouch Pro pages are the
      # web app's own builders, sliced out of docs/app/index.html. This
      # re-extracts them against the live app and also BUILDS all three pages
      # in a browser, so a slice that no longer runs fails here rather than in
      # Photoshop.
      - name: Verify the panel studio tracks the web app exactly
        run: node test/verify_panel_studio_sync.js

      # v6.55.0 — the ten hand-built pages are the ones that drift, so both
      # surfaces are opened side by side IN THE SAME SIGNED-IN STATE and their
      # visible strings compared in order; the panel-only lines are named in
      # the test with the reason each exists. With the studio sync above, all
      # thirteen of the panel's pages are covered.
      - name: Verify every panel page matches the web app
        run: node test/verify_panel_page_parity.js

      # v6.56.1 — the panel's art lives on the web app's host, not inside the
      # .ccx, so the app's picture is a path that cannot rot and the panel's is
      # a URL that can. This runs the panel over all thirteen pages and fails on
      # any visible picture that did not paint — the missing i-target-cream.svg
      # behind RETOUCH B's tab was a silent 404 no string test could see.
      - name: Verify every picture the panel asks for actually paints
        run: node test/verify_panel_art.js

      # v5.86.0 — the owner reported that results vanish when you leave the app
      # and come back. Images were in the Gallery but the page that made them
      # forgot; videos were never saved at all and their link expired in a day;
      # a result carried no BEFORE image, so a returning studio had nothing to
      # compare against; and the store deleted the oldest work past sixty.
      # This drives the real app through a genuine close-and-reopen.
      - name: Verify results survive leaving the app, with their originals
        run: node test/verify_results_persist.js

      # v5.87.0 — Studio Look Copy: one reference photograph's whole look,
      # copied into the student's own photo with their subject, pose, framing
      # and ratio untouched. Twenty-six shipped models can carry its two
      # images, but THIRTEEN of them cap the prompt (800 characters on Qwen
      # Image 2, 2000 on Seedream v4, 3000 on Qwen Image 3) and
      # rhTruncatePrompt cuts silently — so this proves the workflow's TASK
      # GUARD block survives the cut at every cap in the shipped catalog, and
      # that each of its nine switches owns exactly one line of the prompt.
      - name: Verify Studio Look Copy holds its look on every capable model
        run: node test/verify_studio_look_copy.js

      # v6.59.0 — the owner asked, of the Photoshop panel: on every Smart
      # Workflow card, on every image slot, can a photo come in from the
      # ACTIVE LAYER and from the WEB (a link off Pinterest), and does the
      # result go back into Photoshop? It could — one shared inputRow builds
      # the buttons — but "because one function builds them" is an argument,
      # not a check. This opens all 136 photo-taking cards and inspects all
      # 194 slots, and holds the way back out too.
      - name: Verify every panel slot offers every source, on every card
        run: node test/verify_panel_slot_sources.js

      # v5.90.0 — WHAT'S NEW. The owner asked that a student be told what just
      # shipped, at the top, and be able to try it on the spot. The failure
      # mode is not a broken widget, it is a list nobody updates: the app
      # works perfectly with a stale one. So the newest entry must name the
      # APP_VER being shipped, which makes "tell the students" part of
      # releasing rather than a thing to remember.
      - name: Verify the What's New strip, ribbons and per-student memory
        run: PORT=8931 node test/verify_whats_new.js

      # ...and that the panel says the same thing. A student who works in
      # Photoshop all day would otherwise be the last to hear about a
      # workflow they could be using today.
      - name: Verify the panel carries the app's What's New, word for word
        run: node test/verify_panel_whats_new.js

      # v5.90.0 / v6.61.0 — the owner asked whether the picture in an image
      # slot comes out cropped. It did: every slot holding a photo the STUDENT
      # supplied used object-fit:cover in a square-ish box, so a full-length
      # shot lost the head and the shoes. This measures the rendered aspect
      # against the source's, so a crop cannot come back unnoticed.
      - name: Verify every input slot shows the whole photograph
        run: PORT=8931 node test/verify_slot_whole_photo.js

      # v5.91.0 — the thirteen Look Sets. The owner sent thirteen reference
      # shoots and asked for a card each, with the backdrop colour, the light,
      # the grade and the wardrobe fixed so a hundred photographs cut together
      # as one shoot. Every one of those promises lives in a prompt, which is
      # the easiest thing here to weaken by accident, so each is checked.
      - name: Verify the thirteen Look Sets hold their set
        run: PORT=8931 node test/verify_look_sets.js

      # v5.92.0 — what a CAPPED model actually receives, and what a switch
      # turned OFF actually says. Thirteen image models and most video models
      # cut long prompts; this proves the cut hands over the task first, keeps
      # the TASK GUARD whole whenever it fits, never stops mid-word, and is
      # byte-identical on the panel — and that every Look Set switch states
      # what OFF means instead of leaving the rest of the prompt to contradict
      # it.
      - name: Verify what a capped model receives, and what OFF means
        run: PORT=8931 node test/verify_prompt_fit.js

      # v5.93.0 — Wave 11 begins at the door. Every state the account server
      # can report is read from server/lib/auth.js and pushed through both
      # sign-in surfaces: none may reach a student as "can't reach the account
      # server" (which makes a locked-out student retry harder) or as "wrong
      # email or password" (which makes them change a password that was fine).
      # Also pins Enter-to-submit on both surfaces.
      - name: Verify what a student is told when sign-in fails
        run: PORT=8931 node test/verify_auth_messages.js

      # v5.94.0 — the owner asked whether quality, size and ratio really come
      # out. The app's own rule is "never offered-but-ignored", enforced by two
      # hand-written kind tables; nothing checked the tables against the
      # requests. This measures: for every model, does the picked ratio change
      # the body, does 1K vs 4K change it, and does what is SHOWN match what is
      # SENT — in both directions.
      - name: Verify the size and ratio controls reach the engine
        run: PORT=8931 node test/verify_size_ratio_honesty.js

      # v5.95.0 — the owner asked for the prompt to follow the model: drop
      # whole labelled BLOCKS by what the photograph can spare rather than
      # cutting mid-sentence, and when even that will not fit, move the run to
      # a model that can hear the whole workflow — and say so. This proves a
      # surviving block is never half-said, that no essential block is ever a
      # candidate, that freeform text is untouched, and that the panel drops
      # exactly the same blocks.
      - name: Verify the prompt fits the model, and the model fits the prompt
        run: PORT=8931 node test/verify_model_fit.js

      # v5.97.0 — the owner asked whether all models could give the same
      # result. They cannot, and check A proves the reason from the catalog:
      # not one image model exposes a seed, so no run is repeatable. What a
      # hundred photographs CAN be is a matching series, which needs one
      # engine for the whole run — pinned, re-asserted per photo, recorded on
      # each result, and named aloud if it was ever two.
      - name: Verify one series is made by one engine
        run: PORT=8931 node test/verify_series_engine.js

      # v5.98.0 — the owner photographed a run whose pose AND frame ratio had
      # both moved while the prompt promised neither would. The prompt was not
      # the problem: with Ratio on Auto, six endpoints whose documented enum
      # has no auto value were sent "1" — 1:1, SQUARE. A request beats a
      # prompt, so this measures IMAGE 1 from its own header bytes and sends
      # the nearest DOCUMENTED ratio instead, identically on both surfaces.
      - name: Verify a photograph is sent as the shape it already is
        run: node test/verify_ratio_fit.js

      # v5.99.0 — the owner asked whether Derma Skin Pro really produces what
      # its card shows. Its five switches carried no OFF line, so switching
      # one off only deleted its instruction while FINISH went on demanding
      # "completely clear skin", BLEMISH HEALING went on naming body skin,
      # and the AVOID list forbade the mole removal the prompt asked for. A
      # switch is a promise about what will not be touched; this pins it.
      - name: Verify a switch turned off means it across the whole request
        run: PORT=8931 node test/verify_switch_honesty.js

      # v6.0.0 — the owner asked whether a seated half-body photo comes back
      # with its own pose and framing. Sixty-one workflows said nothing at
      # all about the crop, the camera angle, the subject's scale or the
      # aspect ratio, and a model is free with what it is not told. Fifty-one
      # now carry the frame lock, added once where the catalog is assembled;
      # the composers and the pose tool are exempt on purpose, and this pins
      # both sides of that.
      - name: Verify the photograph keeps its own frame and pose
        run: PORT=8931 node test/verify_frame_lock.js

      # v6.1.0 — the Video Smart Workflow. Two cards put a student's own
      # character into a clip they already like: one replaces the whole
      # person, one only the face. Both drive an endpoint that already
      # shipped, so what can go wrong is quieter than a missing feature — a
      # card naming a tool that takes no reference photo, a request written
      # past the endpoint's ceiling and clipped mid-lock, a face card that
      # keeps the hair and changes it in the same breath, or a panel copy
      # that drifts from the app's. This checks all four, on both surfaces.
      - name: Verify the Video Smart Workflow cards
        run: PORT=8931 node test/verify_video_smart_workflow.js

      # v6.4.0 — the owner picked a clip and a face, left the app, came back,
      # and both were gone; a paid RunningHub job that finished while the tab
      # was dead was read once at boot and then left held. This pins all three
      # halves of the repair: the picked files are SHOWN and kept, a Video
      # Tools take is saved and restored under its own page, and the job book
      # is watched until every held job is collected.
      - name: Verify work survives leaving the app
        run: PORT=8931 node test/verify_generate_continuity.js

      # v6.4.0 — the owner asked for the little proportioned boxes beside the
      # ratio choice in the Smart Workflow cards. The rail had existed since
      # v5.56.0 and the wizard called for it, but the wizard builds its step
      # off-document and the attach looked its select up by id, which cannot
      # see a detached element — so the call returned on its first line, in
      # silence, on the one screen where a student who does not know what
      # "3:4" means is choosing.
      - name: Verify the ratio is shown as a shape, in the workflow cards too
        run: PORT=8931 node test/verify_wizard_ratio_rail.js

      # v6.5.0 — RunningHub publishes a machine-readable registry of its own
      # endpoints (HM-RunningHub/ComfyUI_RH_OpenAPI, developer-kit). Until now
      # every resolution, duration and ratio in our catalog was transcribed by
      # hand, and a value the endpoint does not accept is not cosmetic: the
      # student is charged at submit and gets an errorCode back. This holds the
      # catalog to the provider's own schema.
      - name: Verify every shipped endpoint holds to RunningHub's published schema
        run: node test/verify_rh_registry_contract.js

      # v6.5.0 — TALKING PHOTO. The lip-sync endpoints have been published all
      # along; what blocked the feature was that no page in this app had an
      # AUDIO slot to fill their required audioUrl. This pins the slot, the
      # two endpoints, the exact request body, and that neither half of the
      # pair can be skipped into a paid call.
      - name: Verify the Talking Photo page and its two published endpoints
        run: PORT=8931 node test/verify_talking_photo.js

      # v6.6.1 — /lib/ is served cache-first and never revalidated, so a file
      # replaced under its own name is invisible to a returning device until a
      # LIB_PURGES entry NEWER than the replacement clears it. The rule was
      # missed for three waves and the owner saw nine stale cards. This asks
      # the question that matters: not "does a pattern match" but "does an
      # entry a returning device has not run yet match".
      - name: Verify every replaced library file has a purge newer than it
        run: node test/verify_lib_purge_complete.js

      # v6.6.2 — the purge deletes the stale copy on activate, which is AFTER
      # the page has painted from it. The owner opened the release that fixed
      # nine cards and saw all nine still wrong, because the repair landed a
      # moment too late. The worker now names what it removed and the page
      # re-requests exactly those pictures, on this launch rather than the next.
      - name: Verify a replaced picture repaints on the launch that ships it
        run: PORT=8931 node test/verify_lib_art_repaint.js

      # v6.7.4 — and after three releases of repairing CACHES, the repair that
      # cannot fail: a picture replaced under its own name is served under a
      # NEW url. A purge can only fix entries it finds, so a device whose lib
      # cache had been emptied (the app's own "Clear cache + restart", or
      # eviction) was repaired by deleting nothing and then being handed the
      # old bytes by the browser's HTTP cache — with the marker set. No cache
      # can serve a url it has never seen.
      - name: Verify every replaced picture is served under its own url
        run: node test/verify_lib_art_rev.js

      # v6.6.3 — a video tool is offered only the containers it documents.
      # RunningHub's registry says twenty-three of the endpoints we ship take
      # MP4 and only fourteen take anything else; the panel's picker offered
      # mp4/mov/webm to all of them, so a student could hand an iPhone .mov to
      # an MP4-only tool, be charged at submit, and be rejected afterwards.
      # The table is the registry's own and is lifted into the panel, so the
      # two surfaces cannot answer the question differently.
      - name: Verify each video tool is offered only the containers it accepts
        run: node test/verify_video_containers.js

      # v6.7.0 — Retouch A, Retouch B and Retouch Pro all end in one HD Finish
      # pass, and that pass was a single hard-wired endpoint at its bare
      # defaults. RunningHub's schema gives that endpoint faceEnhancement a
      # default of TRUE at 0.8, so the finish quietly re-imagined the face on
      # top of the skin retouch the student had just paid for. This checks
      # every field of every finish body against the published schema, and
      # that the face pass is now the student's choice.
      - name: Verify every HD Finish body holds to RunningHub's published schema
        run: node test/verify_retouch_finish.js

      # v6.7.3 — the V→V deck names what each card needs ("1 video",
      # "1 video + 1 face photo") and students read it, but the pages that
      # TAKE those files said nothing: Video Tools hid its photo button
      # entirely for tools that do not use one, so nobody learned some tools
      # want a photo, and Talking Photo asked for a picture and a recording
      # with two identical buttons. This checks both pages on both surfaces.
      - name: Verify every tool names the files it takes before one is picked
        run: PORT=8931 node test/verify_slot_chips.js

      # v6.8.0 — a student who has just registered used to be shown the PAY
      # screen while the owner was still approving them, and the wall only
      # re-asked every five minutes, so a whole cohort learned to sign out and
      # back in. Waiting is now its own state, with its own words, asked every
      # twenty seconds, and approval lets them in where they stand.
      - name: Verify a registered student waits on the truth and is let in on approval
        run: PORT=8931 node test/verify_pending_approval.js

      # v6.9.0 — the owner photographed the web app on a wide monitor: a
      # phone-shaped column in the middle with dark gutters wider than the
      # content, because layer 2 capped .wrap at 1160px (60% of a 1920 screen,
      # ~45% of a 2560 one). From 1440px the column follows the screen; this
      # measures the column as a share of the viewport at 1366/1920/2560, the
      # wider Smart Workflow grid, no sideways scroll, and the phone untouched.
      - name: Verify the studio fills the monitor it is opened on
        run: PORT=8931 node test/verify_desktop_fill.js

      # v6.9.x — and the website: every section below the hero sat in a 1120px
      # column (57% of a 1920 screen, 43% of a 2560 one). From 1440px the
      # column follows the screen; measured from disk at 1366/1920/2560 and on
      # a 390px phone, which must be byte-for-byte what it was.
      - name: Verify the site fills the monitor it is opened on
        run: node test/verify_landing_fill.js
      - name: Lanna Gold Heritage — the video's set as a card, every switch means what it says
        run: node test/verify_lanna_heritage.js
      - name: Verify the greeting clock reads twelve-hour AM/PM and the card tells the weather
        run: node test/verify_greet_clock_weather.js
      - name: Style Studio — the RunningHub API apps as cards over the studio's own engines
        run: node test/verify_style_studio.js
      - name: Creator Studio — the RunningHub API apps as cards over the studio's own engines
        run: node test/verify_creator_studio.js
      - name: Lens Styles — the Higgsfield Soul looks from RunningHub's registry as cards over the studio's own engines
        run: node test/verify_lens_styles.js
      - name: Video wizard — the 1-2-3-4 guide over the image→video and video→video cards, the same words on app and panel
        run: PORT=8931 node test/verify_video_wizard.js
      - name: Reference-video cards — four image→video Smart Workflow cards rebuilt shot for shot from the owner's clips, your own face in the lead, the same deck lifted into the panel
        run: PORT=8931 node test/verify_ref_video_cards.js
      - name: No gear in the frame — every relight names the light, never the softbox, and every source stays outside the picture on both surfaces
        run: node test/verify_no_gear_in_frame.js
      - name: Flower Path Copy — only the reference's flowers, on your photo's floor at the feet, nothing else moved, the same record on the panel
        run: node test/verify_flower_path_copy.js
      - name: Couple Compose — the bride's and groom's faces set onto the couple photograph, everything else of it kept, the same record on the panel
        run: node test/verify_couple_compose.js
      - name: Prompt history delete — a ✕ on every row, a starred preset asks first, one Clear drops the unstarred and keeps the presets, the box hides when the last prompt goes
        run: PORT=8931 node test/verify_prompt_history_delete.js
      - name: Outfit & Scene — four workflows dress IMAGE 3 from IMAGE 1, set it into IMAGE 2's place and light and keep its pose and frame; the wizard's outfit board lays 2–4 photos into one picture; the same records on the panel
        run: PORT=8931 node test/verify_outfit_scene.js
      - name: Results History delete — a ✕ on every take of all seven strips (the Gallery copy goes with it when there is one), a Clear on the five that had none, the panel's two strips alike
        run: PORT=8931 node test/verify_result_history_delete.js
      - name: Video cards cut fast with VFX — the three tails rewritten, the four exact reference cards untouched, every prompt under its model's cap; reference slots follow the model's image capacity on the strip, in the wizard, on the badge and on the panel
        run: PORT=8931 node test/verify_video_fx_slots.js
      - name: Video-model probe lane — every model can be asked on RunningHub itself through price-preview, no credit spent, the key masked and never written
        run: PORT=8931 node test/verify_video_probe_lane.js

      # v6.53.0 — the Text to Image shelf is the app's own RH_T2I_MODELS,
      # lifted; this re-runs the extraction and proves every model the picker
