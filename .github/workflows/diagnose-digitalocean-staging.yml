name: DigitalOcean Staging Database Binding Diagnostics

on:
  push:
    branches: [codex/bootstrap-staging-db-roles]
    paths:
      - .github/workflows/diagnose-digitalocean-staging.yml

permissions:
  contents: read

concurrency:
  group: digitalocean-staging-database-binding-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    name: Report sanitized staging database binding shape
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DO_APP_NAME: hnk-ai-tools-2
      DO_REPO: hlaingkhay28047-svg/TG
      DO_BRANCH: upgrade-safe-wave
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_STAGING_ACCESS_TOKEN }}
    steps:
      - name: Require staging diagnostics token
        shell: bash
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::Staging database diagnostics require DIGITALOCEAN_STAGING_ACCESS_TOKEN."
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ env.DO_TOKEN }}
          version: 1.166.0

      - name: Capture sanitized database binding diagnostics
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          APPS_FILE="$RUNNER_TEMP/staging-binding-apps.json"
          LIVE_SPEC="$RUNNER_TEMP/staging-binding-spec.json"
          APP_STATE="$RUNNER_TEMP/staging-binding-state.json"
          CLUSTERS_FILE="$RUNNER_TEMP/staging-binding-clusters.json"
          USERS_FILE="$RUNNER_TEMP/staging-binding-users.json"
          ADMIN_URI_FILE="$RUNNER_TEMP/staging-binding-admin-uri"
          trap 'rm -f "$APPS_FILE" "$LIVE_SPEC" "$APP_STATE" "$CLUSTERS_FILE" "$USERS_FILE" "$ADMIN_URI_FILE"' EXIT

          doctl apps list --output json > "$APPS_FILE"
          APP_COUNT="$(jq -r --arg name "$DO_APP_NAME" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            [.[]
              | select(.spec.name == $name)
              | select(any(.spec.static_sites[]?;
                  .github.repo == $repo and .github.branch == $branch))]
            | length
          ' "$APPS_FILE")"
          if [ "$APP_COUNT" -ne 1 ]; then
            echo "::error::Refusing to diagnose an ambiguous staging app selection."
            exit 1
          fi
          APP_ID="$(jq -r --arg name "$DO_APP_NAME" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            .[]
            | select(.spec.name == $name)
            | select(any(.spec.static_sites[]?;
                .github.repo == $repo and .github.branch == $branch))
            | .id
          ' "$APPS_FILE")"

          doctl apps spec get "$APP_ID" --format json > "$LIVE_SPEC"
          doctl apps get "$APP_ID" --output json > "$APP_STATE"
          DB_COUNT="$(jq -r '[.databases[]? | select(.engine == "PG")] | length' "$LIVE_SPEC")"
          if [ "$DB_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one PostgreSQL staging database component."
            exit 1
          fi

          DB_KEYS="$(jq -r '[.databases[] | select(.engine == "PG")][0] | keys | sort | join(",")' "$LIVE_SPEC")"
          ACTIVE_DB_KEYS="$(jq -r --arg id "$APP_ID" '
            [(if type == "array" then .[] else . end)
              | select(.id == $id) | .active_deployment.databases[]?]
            | if length == 1 then (.[0] | keys | sort | join(",")) else "" end
          ' "$APP_STATE")"
          CLUSTER_NAME="$(jq -r '[.databases[] | select(.engine == "PG")][0].cluster_name // empty' "$LIVE_SPEC")"
          DB_USER="$(jq -r '[.databases[] | select(.engine == "PG")][0].db_user // empty' "$LIVE_SPEC")"
          DB_NAME="$(jq -r '[.databases[] | select(.engine == "PG")][0].db_name // empty' "$LIVE_SPEC")"

          echo "desired_database_keys=$DB_KEYS"
          echo "active_database_keys=${ACTIVE_DB_KEYS:-none}"
          echo "cluster_name_present=$([ -n "$CLUSTER_NAME" ] && echo true || echo false)"
          echo "db_user_present=$([ -n "$DB_USER" ] && echo true || echo false)"
          echo "db_name_present=$([ -n "$DB_NAME" ] && echo true || echo false)"

          doctl databases list --output json > "$CLUSTERS_FILE"
          echo "account_postgresql_cluster_count=$(jq -r '[.[] | select(.engine_slug == "postgresql")] | length' "$CLUSTERS_FILE")"
          if [ -z "$CLUSTER_NAME" ]; then
            echo "exact_cluster_match=unavailable"
            exit 0
          fi

          CLUSTER_COUNT="$(jq -r --arg name "$CLUSTER_NAME" '[.[] | select(.name == $name and .engine_slug == "postgresql")] | length' "$CLUSTERS_FILE")"
          echo "exact_cluster_match=$([ "$CLUSTER_COUNT" -eq 1 ] && echo true || echo false)"
          if [ "$CLUSTER_COUNT" -ne 1 ]; then
            exit 0
          fi
          CLUSTER_ID="$(jq -r --arg name "$CLUSTER_NAME" '.[] | select(.name == $name and .engine_slug == "postgresql") | .id' "$CLUSTERS_FILE")"
          doctl databases user list "$CLUSTER_ID" --output json > "$USERS_FILE"
          echo "primary_user_count=$(jq -r '[.[] | select(.role == "primary")] | length' "$USERS_FILE")"
          echo "normal_user_count=$(jq -r '[.[] | select(.role == "normal")] | length' "$USERS_FILE")"
          if [ -n "$DB_USER" ]; then
            echo "spec_user_match_count=$(jq -r --arg user "$DB_USER" '[.[] | select(.name == $user)] | length' "$USERS_FILE")"
          else
            echo "spec_user_match_count=unavailable"
          fi

          if ! command -v psql >/dev/null 2>&1; then
            echo "psql_available=false"
            exit 0
          fi
          echo "psql_available=true"
          doctl databases connection "$CLUSTER_ID" --format URI --no-header > "$ADMIN_URI_FILE"
          chmod 600 "$ADMIN_URI_FILE"
          ADMIN_CAPABILITY="$(psql "$(cat "$ADMIN_URI_FILE")" -XAtq -v ON_ERROR_STOP=1 \
            -c "select rolcreaterole::text || '|' || rolcreatedb::text from pg_roles where rolname=current_user")"
          echo "default_connection_can_create_role=${ADMIN_CAPABILITY%%|*}"
          echo "default_connection_can_create_database=${ADMIN_CAPABILITY##*|}"
