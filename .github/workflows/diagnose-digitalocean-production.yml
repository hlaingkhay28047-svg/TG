name: DigitalOcean Production Migration Diagnostics

# WHY THIS EXISTS. When hnk-ai-tools-3 fails a deploy with
# DeployContainerHealthChecksFailed, App Platform rolls the old build back and
# the container that could have said why is gone. /api/health answers from the
# build that survived, so it reports the OLD state and nothing about the failure
# — which is how a one-line `migrate:` message becomes an afternoon of guessing.
#
# The staging lane already had this. Production did not, and the first time it
# mattered the only route to the reason was asking the owner to photograph a
# console on a phone. This is the same reading, available to anyone with the
# Actions tab.
#
# IT NEVER PRINTS RAW LOGS. Runtime output carries connection strings and
# whatever an error happened to interpolate, and an Actions log is readable by
# anyone who can see the run. So the output is redacted, stripped to printable
# ASCII, filtered to an allowlist of migration and boot lines, truncated, and
# wrapped in stop-commands so a log line cannot forge a workflow command.
#
# IT READS THE DEPLOYMENT THAT FAILED, not the one that survived. That was the
# first version's mistake: `doctl apps logs --type deploy` defaults to the
# ACTIVE deployment, so after a rollback it returns the old build cheerfully
# reporting that its migration succeeded — the exact opposite of the reading
# the incident needed. By default this now finds the most recent deployment in
# an ERROR phase and asks for that one by id.
#
# MANUAL ONLY. There is nothing to gate: it reads, it does not deploy, and a
# scheduled lane would hold a production token open for no reason.

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Deployment id to read (default: the most recent failed one)"
        required: false
        default: ""
        type: string
      watch:
        description: "Follow a deployment that is still running, so its container's output is captured before DigitalOcean discards it"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: digitalocean-production-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    name: Report sanitized hnk-api migration state
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DO_APP_NAME: hnk-ai-tools-3
      DO_REPO: hlaingkhay28047-svg/TG
      DO_BRANCH: main
      DO_SERVICE: hnk-api
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_PRODUCTION_ACCESS_TOKEN }}
      # Through the environment, never interpolated into the script: a
      # workflow input is attacker-controlled text the moment anyone else can
      # dispatch it, and ${{ }} inside run: is substituted before bash sees it.
      DEPLOYMENT_INPUT: ${{ inputs.deployment }}
      WATCH_INPUT: ${{ inputs.watch }}
    steps:
      - name: Require production diagnostics token
        shell: bash
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::Production migration diagnostics require DIGITALOCEAN_PRODUCTION_ACCESS_TOKEN."
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ env.DO_TOKEN }}
          version: 1.166.0

      - name: Capture sanitized migration diagnostics
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          APPS_FILE="$RUNNER_TEMP/production-diagnostic-apps.json"
          RAW_LOG="$RUNNER_TEMP/production-diagnostic-runtime.log"
          CLEAN_LOG="$RUNNER_TEMP/production-diagnostic-clean.log"
          SAFE_LOG="$RUNNER_TEMP/production-diagnostic-sanitized.log"
          trap 'rm -f "$APPS_FILE" "$RAW_LOG" "$CLEAN_LOG" "$SAFE_LOG"' EXIT

          doctl apps list --output json > "$APPS_FILE"
          APP_COUNT="$(jq -r --arg name "$DO_APP_NAME" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            [.[]
              | select(.spec.name == $name)
              | select(any(.spec.static_sites[]?;
                  .github.repo == $repo and .github.branch == $branch))]
            | length
          ' "$APPS_FILE")"
          if [ "$APP_COUNT" -ne 1 ]; then
            echo "::error::Refusing to diagnose an ambiguous production app selection."
            exit 1
          fi
          APP_ID="$(jq -r --arg name "$DO_APP_NAME" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            .[]
            | select(.spec.name == $name)
            | select(any(.spec.static_sites[]?;
                .github.repo == $repo and .github.branch == $branch))
            | .id
          ' "$APPS_FILE")"

          # An id is a UUID or nothing. Checked before it reaches a command line
          # because anyone who can dispatch this workflow chooses its value.
          case "$DEPLOYMENT_INPUT" in
            "") DEPLOYMENT="" ;;
            [0-9a-fA-F]*[-][0-9a-fA-F]*[-][0-9a-fA-F]*[-][0-9a-fA-F]*[-][0-9a-fA-F]*)
              case "$DEPLOYMENT_INPUT" in
                *[!0-9a-fA-F-]*)
                  echo "::error::Refusing a deployment id with unexpected characters."
                  exit 1 ;;
                *) DEPLOYMENT="$DEPLOYMENT_INPUT" ;;
              esac ;;
            *)
              echo "::error::Refusing a deployment id that is not a UUID."
              exit 1 ;;
          esac

          DEPLOYMENTS_FILE="$RUNNER_TEMP/production-diagnostic-deployments.json"
          trap 'rm -f "$APPS_FILE" "$RAW_LOG" "$CLEAN_LOG" "$SAFE_LOG" "$DEPLOYMENTS_FILE"' EXIT

          deployment_phase() {
            doctl apps list-deployments "$APP_ID" --output json > "$DEPLOYMENTS_FILE" 2>/dev/null || return 1
            jq -r --arg id "$1" '.[] | select(.id == $id) | .phase // empty' "$DEPLOYMENTS_FILE"
          }

          # THE POINT OF THIS WHOLE FILE. After a failed deploy App Platform
          # rolls back, and the ACTIVE deployment is then the build that
          # SURVIVED — so the default --type deploy log is the healthy old
          # container saying its migration succeeded. The deployment worth
          # reading is the newest one that ended in ERROR; in watch mode it is
          # whichever one is still running.
          if [ -z "$DEPLOYMENT" ] && doctl apps list-deployments "$APP_ID" --output json > "$DEPLOYMENTS_FILE" 2>/dev/null; then
            if [ "$WATCH_INPUT" = "true" ]; then
              DEPLOYMENT="$(jq -r '
                [.[] | select(.phase | IN("ERROR","ACTIVE","CANCELED","SUPERSEDED") | not)]
                | sort_by(.created_at) | last | .id // empty
              ' "$DEPLOYMENTS_FILE")"
            fi
            if [ -z "$DEPLOYMENT" ]; then
              DEPLOYMENT="$(jq -r '
                [.[] | select(.phase == "ERROR")]
                | sort_by(.created_at) | last | .id // empty
              ' "$DEPLOYMENTS_FILE")"
            fi
          fi

          if [ -n "$DEPLOYMENT" ]; then
            echo "Reading deployment $DEPLOYMENT (phase $(deployment_phase "$DEPLOYMENT"))"
          else
            echo "No failed deployment found; reading the active one."
          fi

          : > "$RAW_LOG"
          FOUND=0

          fetch_once() {
            # Both log types, because a container that never became ready splits
            # its story between them: the deploy log carries the boot and the
            # migration, the run log whatever the process managed to say after.
            for TYPE in deploy run; do
              if [ -n "$DEPLOYMENT" ]; then
                doctl apps logs "$APP_ID" "$DO_SERVICE" --deployment "$DEPLOYMENT" \
                  --type "$TYPE" --tail 300 --no-prefix >> "$RAW_LOG" 2>&1 && FOUND=1 || true
              else
                doctl apps logs "$APP_ID" "$DO_SERVICE" \
                  --type "$TYPE" --tail 300 --no-prefix >> "$RAW_LOG" 2>&1 && FOUND=1 || true
              fi
            done
          }

          # WATCH MODE EXISTS BECAUSE THE READING IS PERISHABLE. Asked for a
          # finished deployment's container output, the API refuses outright:
          #
          #   400 cannot get running logs from deployment <id> in phase
          #   final_cleanup
          #
          # A container that fails its health checks is rolled back and reaped,
          # and everything it said goes with it. There is no after-the-fact
          # reading to take, so the only way to learn why is to be holding the
          # line while it is still talking. Poll until the deployment reaches a
          # terminal phase, keeping every snapshot; the duplicates the overlap
          # produces are collapsed at the end, which is much cheaper than
          # missing the one line that mattered.
          if [ "$WATCH_INPUT" = "true" ] && [ -n "$DEPLOYMENT" ]; then
            DEADLINE=$(( $(date +%s) + 480 ))
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              fetch_once
              PHASE="$(deployment_phase "$DEPLOYMENT")"
              case "$PHASE" in
                ERROR|ACTIVE|CANCELED|SUPERSEDED|"")
                  echo "Deployment reached phase ${PHASE:-unknown}; stopping."
                  break ;;
              esac
              sleep 10
            done
            fetch_once
          else
            fetch_once
          fi

          if [ "$FOUND" -ne 1 ]; then
            echo "::error::DigitalOcean logs could not be retrieved. Raw output remains private."
            exit 1
          fi

          sed -E \
            -e 's#postgres(ql)?://[^[:space:]]+#postgres://<redacted>#gI' \
            -e 's/(password=)[^[:space:]]+/\1<redacted>/gI' \
            -e 's/(PGPASSWORD=)[^[:space:]]+/\1<redacted>/gI' \
            -e 's/((token|secret|api[_-]?key)=)[^[:space:]]+/\1<redacted>/gI' \
            "$RAW_LOG" \
            | LC_ALL=C tr -cd '\11\12\15\40-\176' \
            | awk '!seen[$0]++' \
            > "$CLEAN_LOG"

          # AN ALLOWLIST THAT ONLY KNOWS THE HAPPY PATH CANNOT REPORT A
          # SURPRISE. The first version listed the lines a migration prints
          # when it runs, so a container that died BEFORE migrating matched
          # nothing and the lane reported "no diagnostics present" — which is
          # the one case the lane exists for. The vocabulary of failure is
          # added here: Node's error and stack shapes, the connection and
          # certificate errors a managed database produces, and the process
          # signals App Platform kills a container with. Redaction still runs
          # first, so a widened filter widens what is explained, not what is
          # exposed.
          grep -E \
            -e 'hnk-api listening|migrate:|db: WARNING' \
            -e 'WARNING: could not reach the database|WARNING: booting anyway' \
            -e 'FATAL: migration failed|FATAL: booting LOCKED' \
            -e '^[A-Za-z]*Error(:| )|^ +at |Cannot find module|MODULE_NOT_FOUND' \
            -e 'ECONNREFUSED|ENOTFOUND|ETIMEDOUT|EAI_AGAIN|ECONNRESET|EADDRINUSE' \
            -e 'certificate|password authentication failed|too many connections' \
            -e 'permission denied|relation .* does not exist|lock timeout' \
            -e 'security_configuration_missing|database_tls_unverified|schema_incomplete' \
            -e 'npm ERR!|node:internal|SIGTERM|SIGKILL|OOMKilled|exited with' \
            "$CLEAN_LOG" \
            | cut -c1-1000 \
            | tail -n 120 > "$SAFE_LOG" || true

          # A COUNT IS NOT CONTENT. Reporting how many lines the deployment
          # actually produced costs nothing and separates the two readings the
          # first version confused: a deployment whose logs are gone or empty,
          # and one that said plenty of things none of which were recognised.
          RAW_LINES="$(wc -l < "$CLEAN_LOG" | tr -d ' ')"
          echo "Deployment produced ${RAW_LINES} log line(s)."

          if [ ! -s "$SAFE_LOG" ]; then
            if [ "$RAW_LINES" -eq 0 ]; then
              echo "::error::That deployment produced no log output at all — DigitalOcean has none retained for it."
            else
              echo "::error::${RAW_LINES} log line(s) were present and none matched the diagnostic filter. Raw output remains private."
            fi
            exit 1
          fi

          echo "::group::Sanitized hnk-api migration diagnostics"
          STOP_TOKEN="production-diagnostic-$(openssl rand -hex 16)"
          echo "::stop-commands::$STOP_TOKEN"
          cat "$SAFE_LOG"
          echo "::$STOP_TOKEN::"
          echo "::endgroup::"
