name: Set production security secrets

# WHY THIS EXISTS. The service reported all six security secrets missing while
# the DigitalOcean console showed all six present and encrypted. Both readings
# were honest: the console truncates a long key to the width of its input box,
# so a key stored as MFA_ENCRYPTION_K is indistinguishable there from the
# MFA_ENCRYPTION_KEY the service is looking for. Five production deploys failed
# on it.
#
# Typing the names again by hand would risk the same outcome, from a phone,
# with no way to check the result. This writes them once, in full, from a
# program, and then reads the live spec back and proves the six names it
# expects are the six names the platform now holds.
#
# THE VALUES NEVER LEAVE DIGITALOCEAN AND THE RUNNER. They are generated here
# by the system CSPRNG, written straight into the spec handed to doctl, and
# never printed. Nothing is read from the repository, so no secret can reach
# git. The output names keys and reports byte lengths only.
#
# IT ROTATES ALL SIX, deliberately. Secrets that may have been stored under
# truncated names cannot be trusted individually, and JWT_SECRET among them
# means every existing session is signed out — correct for a credential whose
# disposition is uncertain, and the owner has confirmed there are no student
# accounts yet.
#
# MANUAL, AND GUARDED. It changes production configuration, so it never runs on
# a push and requires the word ROTATE to be typed at dispatch.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ROTATE to replace all six security secrets (signs out every session)"
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: digitalocean-production-secrets
  cancel-in-progress: false

jobs:
  rotate:
    name: Write the six security secrets to hnk-api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DO_APP_NAME: hnk-ai-tools-3
      DO_REPO: hlaingkhay28047-svg/TG
      DO_BRANCH: main
      DO_SERVICE: hnk-api
      DO_TOKEN: ${{ secrets.DIGITALOCEAN_PRODUCTION_ACCESS_TOKEN }}
      # Through the environment, never interpolated into the script: a workflow
      # input is attacker-controlled text the moment anyone else can dispatch it.
      CONFIRM_INPUT: ${{ inputs.confirm }}
    steps:
      - name: Require the typed confirmation
        shell: bash
        run: |
          if [ "$CONFIRM_INPUT" != "ROTATE" ]; then
            echo "::error::Refusing to rotate production secrets without the typed confirmation ROTATE."
            exit 1
          fi

      - name: Require production token
        shell: bash
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::Rotating production secrets requires DIGITALOCEAN_PRODUCTION_ACCESS_TOKEN."
            exit 1
          fi

      - name: Check out the patch script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ env.DO_TOKEN }}
          version: 1.166.0

      - name: Write the secrets into the live spec
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          APPS_FILE="$RUNNER_TEMP/secret-rotation-apps.json"
          LIVE_SPEC="$RUNNER_TEMP/secret-rotation-live.json"
          PATCHED_SPEC="$RUNNER_TEMP/secret-rotation-patched.json"
          VERIFY_SPEC="$RUNNER_TEMP/secret-rotation-verify.json"
          # The patched spec holds six plaintext secrets until DigitalOcean has
          # them. Remove it on every exit path, successful or not.
          trap 'rm -f "$APPS_FILE" "$LIVE_SPEC" "$PATCHED_SPEC" "$VERIFY_SPEC"' EXIT

          doctl apps list --output json > "$APPS_FILE"
          APP_COUNT="$(jq -r --arg name "$DO_APP_NAME" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            [.[]
              | select(.spec.name == $name)
              | select(any(.spec.static_sites[]?;
                  .github.repo == $repo and .github.branch == $branch))]
            | length
          ' "$APPS_FILE")"
          if [ "$APP_COUNT" -ne 1 ]; then
            echo "::error::Refusing to write secrets to an ambiguous production app selection."
            exit 1
          fi
          APP_ID="$(jq -r --arg name "$DO_APP_NAME" --arg repo "$DO_REPO" --arg branch "$DO_BRANCH" '
            .[]
            | select(.spec.name == $name)
            | select(any(.spec.static_sites[]?;
                .github.repo == $repo and .github.branch == $branch))
            | .id
          ' "$APPS_FILE")"

          doctl apps spec get "$APP_ID" --format json > "$LIVE_SPEC"
          node .github/scripts/set_production_secrets.js \
            "$LIVE_SPEC" "$PATCHED_SPEC" "$DO_SERVICE"

          # --update-sources is deliberately absent: this changes configuration,
          # not which commit is deployed.
          doctl apps update "$APP_ID" --spec "$PATCHED_SPEC" \
            --format ID,DefaultIngress,Updated
          rm -f "$PATCHED_SPEC"

          # READ IT BACK. The whole failure being fixed here is a configuration
          # that looked right and was not, so the run does not get to claim
          # success on the strength of having submitted something.
          doctl apps spec get "$APP_ID" --format json > "$VERIFY_SPEC"
          MISSING=""
          for KEY in JWT_SECRET MFA_ENCRYPTION_KEY DEVICE_ID_HASH_SECRET \
                     DEVICE_PAIRING_SECRET CCX_DOWNLOAD_SECRET PANEL_LEASE_SECRET; do
            FOUND="$(jq -r --arg service "$DO_SERVICE" --arg key "$KEY" '
              [.services[]? | select(.name == $service) | .envs[]?
                | select(.key == $key and .type == "SECRET" and .scope == "RUN_TIME")]
              | length
            ' "$VERIFY_SPEC")"
            if [ "$FOUND" != "1" ]; then MISSING="$MISSING $KEY"; fi
          done
          echo "::group::Environment variables the live spec now defines for $DO_SERVICE"
          jq -r --arg service "$DO_SERVICE" '
            .services[]? | select(.name == $service) | .envs[]?
            | "  \(.key)  type=\(.type // "GENERAL")  scope=\(.scope // "RUN_AND_BUILD_TIME")"
          ' "$VERIFY_SPEC" | sort
          echo "::endgroup::"
          if [ -n "$MISSING" ]; then
            echo "::error::These keys are still not SECRET + RUN_TIME on $DO_SERVICE:$MISSING"
            exit 1
          fi
          echo "All six security secrets are present as SECRET, scoped RUN_TIME."
