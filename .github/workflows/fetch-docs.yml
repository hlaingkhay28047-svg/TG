name: Fetch RunningHub doc pages

# Read-only helper. The sandboxed dev container's egress policy blocks
# runninghub.ai, so it cannot read the PUBLIC API doc pages (the same
# "Copy Page" markdown the owner pastes by hand). GitHub runners can.
# This job curls a fixed list of doc pages and prints each into the job
# log between unambiguous markers; the container then reads the log via
# the GitHub API. No secrets are used, nothing is written to the repo,
# and the fetched text is treated as reference data only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "identify = print only what each page IS (title/path/folder); full = print the whole spec"
        required: false
        default: "identify"
        type: choice
        options: ["identify", "full"]
  push:
    branches: [claude/hnk-studio-deployment-pr292-www53j]
    paths: [".github/workflows/fetch-docs.yml"]

permissions:
  contents: read

jobs:
  index:
    # v5.89.0 — the owner asks periodically whether RunningHub has published
    # anything new on the Enterprise-Share catalog. Every earlier round fetched
    # a hand-typed list of doc ids, which can only ever re-read what we already
    # knew. This job goes the other way: it reads the doc site's own index and
    # prints EVERY api-<id> it links, so a page published since the last round
    # shows up by itself. Nothing here is written to the repo; the ids it finds
    # are then fetched by the job below.
    name: index
    runs-on: ubuntu-24.04
    steps:
      - name: List every doc page the site links
        run: |
          for u in \
            "https://www.runninghub.ai/runninghub-api-doc-en/" \
            "https://www.runninghub.ai/runninghub-api-doc/" \
            "https://www.runninghub.ai/sitemap.xml" \
            "https://www.runninghub.ai/runninghub-api-doc-en/sitemap.xml" ; do
            echo "=====INDEX ${u} START====="
            curl -sSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 "$u" \
              | grep -oE 'api-[0-9]{6,}' | sort -u \
              || echo "FETCH-FAILED ${u}"
            echo "=====INDEX ${u} END====="
          done
  price:
    # v6.1.0 — the owner asked whether RunningHub has anything FREE a student
    # could test with. The API specs never say what a call costs; the cost
    # lives on the public pricing/plan pages and in the account balance the
    # app already reads (remainCoins). This job reads only the PUBLIC pages
    # and prints every line that mentions a free tier, a coin, or a price, so
    # the answer comes from RunningHub's own words rather than memory. No
    # secrets, nothing written to the repo.
    name: price
    runs-on: ubuntu-24.04
    steps:
      - name: Where RunningHub publishes its prices
        # Round 7a guessed /pricing and /en/pricing; both answered 0 bytes, so
        # the path is something else. Ask the site: read its sitemap and its
        # own homepage links, and print every URL whose path could carry a
        # price, a coin or a free tier. No guessing from memory.
        run: |
          echo "=====SITEMAP CANDIDATES START====="
          curl -sSL --retry 2 --connect-timeout 10 --max-time 60 "https://www.runninghub.ai/sitemap.xml" \
            | grep -oE 'https?://[^<> ]+' | sort -u \
            | grep -iE 'pric|coin|free|plan|vip|member|billing|recharge|subscri|invite' | head -40 \
            || echo "NO-MATCH"
          echo "=====SITEMAP CANDIDATES END====="
          echo "=====HOMEPAGE LINKS START====="
          curl -sSL --retry 2 --connect-timeout 10 --max-time 60 "https://www.runninghub.ai/" \
            | grep -oE 'href="[^"]{1,120}"' | sed 's/^href="//; s/"$//' | sort -u \
            | grep -iE 'pric|coin|free|plan|vip|member|billing|recharge|subscri|invite' | head -40 \
            || echo "NO-MATCH"
          echo "=====HOMEPAGE LINKS END====="
      - name: What those pages say about free use and cost
        run: |
          for u in \
            "https://www.runninghub.ai/pricing-plan" \
            "https://www.runninghub.ai/price" \
            "https://www.runninghub.ai/coin" \
            "https://www.runninghub.ai/membership" \
            "https://www.runninghub.ai/invite" \
            "https://www.runninghub.ai/runninghub-api-doc-en/api-425761030.md" ; do
            echo "=====PRICE ${u} START====="
            body=$(curl -sSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 "$u" || echo "FETCH-FAILED")
            echo "BYTES: ${#body}"
            printf '%s' "$body" \
              | tr '>' '>\n' \
              | grep -oiE '[^<>]{0,100}(free[^<>]{0,60}|[0-9][0-9., ]*(rh )?coins?|per (image|run|call|generation)|\$[0-9]+(\.[0-9]+)?)[^<>]{0,60}' \
              | sed 's/^[[:space:]]*//' | sort -u | head -40 \
              || echo "NO-MATCH"
            echo "=====PRICE ${u} END====="
          done
      - name: Does the API itself grant a free quota
        # The app already reads freeLimit / isFreeThisCall /
        # remainingFreeLimitCount off /openapi/v2/price-preview (see
        # rhPricePreview in docs/app/index.html). Find the doc pages whose
        # own link text names a price, a coin or a free quota, and print
        # them, so what a "free call" means comes from the spec rather than
        # from the field names.
        run: |
          idx=$(curl -sSL --retry 2 --connect-timeout 10 --max-time 90 \
                 "https://www.runninghub.ai/runninghub-api-doc-en/" || echo "")
          echo "BYTES: ${#idx}"
          echo "=====MONEY PAGES START====="
          hits=$(printf '%s' "$idx" \
            | grep -oE 'api-[0-9]{6,}[^<]{0,12}>[^<]{1,80}' \
            | grep -iE 'price|free|coin|bill|quota|balance|account|wallet' | sort -u | head -20)
          echo "$hits"
          echo "=====MONEY PAGES END====="
          for id in $(printf '%s' "$hits" | grep -oE '[0-9]{6,}' | sort -u | head -8); do
            echo "=====FREE-SPEC ${id}====="
            curl -sSL --retry 2 --connect-timeout 10 --max-time 60 \
              "https://www.runninghub.ai/runninghub-api-doc-en/api-${id}.md" \
              | grep -iE '^# |^  /|free|coin|price' | head -30 \
              || echo "FETCH-FAILED ${id}"
          done
  fetch:
    name: fetch-${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 6 — the pages that describe something NOT already wired.
          # Round 5's identify pass named all 33 pages published since the
          # last sweep; 22 of them document endpoints this app already
          # sends (the seedance-2.5 token routes, flux-3-video, wan-3.0 and
          # wan-3.0-prime, grok-imagine v1.5, the minimax-h3-oss plugin
          # flows), and three describe surfaces the app does not have at all
          # (Qwen3 TTS voice design is audio; meshy6 image/text-to-3D is 3D).
          # The eleven below are the real additions, and only a read spec
          # licenses an entry — six per job keeps each log under the cap.
          - name: new6a
            ids: "498427799 498427800 498427801 498427802 498427804 509445864"
          - name: new6b
            ids: "509445865 508886443 508886444 508886445 510034450"
          # The twelfth. regeneration-image-to-video was refused in v5.55.0
          # with the note "no longer in the doc index at all" — round 5's
          # index pass found it again, so the reason is stale and its spec
          # is fetched here rather than assumed from its two siblings.
          - name: new6c
            ids: "498427803"
          # Round 7 (v6.1.0) — every api-<id> the sitemap links today that no
          # earlier round has read. Identify-only: a title, a path and the
          # folder is enough to say whether a page is a model this app could
          # offer, and only a read spec ever licenses an entry.
          - name: new7a
            ids: "502119462 502119463 505575334 505575335 505922313 505922314 508112799"
          - name: new7b
            ids: "509122419 509122420 510573734 510773979 510773980"
    steps:
      # v5.89.0 — two modes. IDENTIFY prints only the few lines that say WHAT
      # an endpoint is (its title, its path, the folder the doc site files it
      # under). Thirty-three whole OpenAPI specs are hundreds of KB and the
      # job-log API truncates from the start, so reading them all just to
      # learn which are new wastes the very budget that loses pages. Once the
      # interesting ids are known, FULL pulls those specs in whole.
      - name: Identify each doc page
        if: ${{ inputs.mode != 'full' }}
        run: |
          for id in ${{ matrix.ids }}; do
            echo "=====ID ${id}====="
            curl -sSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 \
              "https://www.runninghub.ai/runninghub-api-doc-en/api-${id}.md" \
              | grep -E '^# |^  /|x-apifox-folder|^      summary:|^      operationId:' \
              | head -12 \
              || echo "FETCH-FAILED ${id}"
          done
      - name: Fetch doc pages
        if: ${{ inputs.mode == 'full' }}
        run: |
          for id in ${{ matrix.ids }}; do
            echo "=====DOC ${id} START====="
            curl -sSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 \
              "https://www.runninghub.ai/runninghub-api-doc-en/api-${id}.md" \
              || echo "FETCH-FAILED ${id}"
            echo ""
            echo "=====DOC ${id} END====="
          done
