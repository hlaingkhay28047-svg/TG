name: Fetch RunningHub doc pages

# Read-only helper. The sandboxed dev container's egress policy blocks
# runninghub.ai, so it cannot read the PUBLIC API doc pages (the same
# "Copy Page" markdown the owner pastes by hand). GitHub runners can.
# This job curls a fixed list of doc pages and prints each into the job
# log between unambiguous markers; the container then reads the log via
# the GitHub API. No secrets are used, nothing is written to the repo,
# and the fetched text is treated as reference data only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "identify = print only what each page IS (title/path/folder); full = print the whole spec"
        required: false
        default: "identify"
        type: choice
        options: ["identify", "full"]
  push:
    branches: [claude/hnk-studio-deployment-pr292-www53j]
    paths: [".github/workflows/fetch-docs.yml"]

permissions:
  contents: read

jobs:
  index:
    # v5.89.0 — the owner asks periodically whether RunningHub has published
    # anything new on the Enterprise-Share catalog. Every earlier round fetched
    # a hand-typed list of doc ids, which can only ever re-read what we already
    # knew. This job goes the other way: it reads the doc site's own index and
    # prints EVERY api-<id> it links, so a page published since the last round
    # shows up by itself. Nothing here is written to the repo; the ids it finds
    # are then fetched by the job below.
    name: index
    runs-on: ubuntu-24.04
    steps:
      - name: List every doc page the site links
        run: |
          for u in \
            "https://www.runninghub.ai/runninghub-api-doc-en/" \
            "https://www.runninghub.ai/runninghub-api-doc/" \
            "https://www.runninghub.ai/sitemap.xml" \
            "https://www.runninghub.ai/runninghub-api-doc-en/sitemap.xml" ; do
            echo "=====INDEX ${u} START====="
            curl -sSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 "$u" \
              | grep -oE 'api-[0-9]{6,}' | sort -u \
              || echo "FETCH-FAILED ${u}"
            echo "=====INDEX ${u} END====="
          done
  fetch:
    name: fetch-${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 5 — every doc page published SINCE the last catalog sweep.
          # The index job read the site's own sitemap; 498427798 was the
          # highest page any earlier round had seen, and these 33 ids sit
          # above it. Seven per job: the job-log API returns ~350KB per job,
          # truncated from the START, which is the round-3b lesson.
          - name: new5a
            ids: "498427799 498427800 498427801 498427802 498427803 498427804 498749512"
          - name: new5b
            ids: "498749513 498749514 498749515 498749516 498749517 498749518 498749519"
          - name: new5c
            ids: "498749520 498749521 498749522 498749523 502119462 502119463 505575334"
          - name: new5d
            ids: "505575335 505922313 505922314 508112799 508886443 508886444 508886445"
          - name: new5e
            ids: "509122419 509122420 509445864 509445865 510034450"
    steps:
      # v5.89.0 — two modes. IDENTIFY prints only the few lines that say WHAT
      # an endpoint is (its title, its path, the folder the doc site files it
      # under). Thirty-three whole OpenAPI specs are hundreds of KB and the
      # job-log API truncates from the start, so reading them all just to
      # learn which are new wastes the very budget that loses pages. Once the
      # interesting ids are known, FULL pulls those specs in whole.
      - name: Identify each doc page
        if: ${{ inputs.mode != 'full' }}
        run: |
          for id in ${{ matrix.ids }}; do
            echo "=====ID ${id}====="
            curl -sSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 \
              "https://www.runninghub.ai/runninghub-api-doc-en/api-${id}.md" \
              | grep -E '^# |^  /|x-apifox-folder|^      summary:|^      operationId:' \
              | head -12 \
              || echo "FETCH-FAILED ${id}"
          done
      - name: Fetch doc pages
        if: ${{ inputs.mode == 'full' }}
        run: |
          for id in ${{ matrix.ids }}; do
            echo "=====DOC ${id} START====="
            curl -sSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 \
              "https://www.runninghub.ai/runninghub-api-doc-en/api-${id}.md" \
              || echo "FETCH-FAILED ${id}"
            echo ""
            echo "=====DOC ${id} END====="
          done
