name: Fetch RunningHub doc pages

# Read-only helper. The sandboxed dev container's egress policy blocks
# runninghub.ai, so it cannot read the PUBLIC API doc pages (the same
# "Copy Page" markdown the owner pastes by hand). GitHub runners can.
# This job curls a fixed list of doc pages and prints each into the job
# log between unambiguous markers; the container then reads the log via
# the GitHub API. No secrets are used, nothing is written to the repo,
# and the fetched text is treated as reference data only.
on:
  workflow_dispatch:
  push:
    branches: [claude/hnk-studio-deployment-pr292-www53j]
    paths: [".github/workflows/fetch-docs.yml"]

permissions:
  contents: read

jobs:
  fetch:
    name: fetch-${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 3 — the full video catalog (image-to-video,
          # text-to-video, reference-to-video, video-edit/tools/extend,
          # motion-control, audio-to-video, digital-human) for the
          # owner's "add every documented video model" wave. The four
          # video pages round 2 already pulled are not re-fetched.
          - name: vid01
            ids: "448184341 448184344 448184343 448184345 448184340 448184339 448184338 448184336 448184337 448184342 448184350 448184354 448184349 448184352 448184346 448184353 448184347 448184351 494859291 448184355 494859292"
          - name: vid02
            ids: "448184348 494859290 449426879 449426878 494859288 448184356 498749516 494859287 448184357 498749515 494859285 494859286 448184359 448184358 448184367 448184360 448184366 448184365 448184364 448184363 448184362"
          - name: vid03
            ids: "448184361 448184368 448184369 448184370 448184374 448184373 471297125 448184372 448184379 448184376 448184380 448184377 448184378 448184381 448184384 448184383 448184386 448184388 448184382 494859283 448184387"
          - name: vid04
            ids: "505575335 505922314 448184390 448184389 448184391 494859289 448184393 448184394 450326933 494859284 454760427 454760426 462492098 494859293 494859294 495380676 498749517 502119462 494859282 448184397 495380675"
          - name: vid05
            ids: "494859281 448184400 498749513 450573659 498749512 448184403 459865193 448184395 448184399 454760425 494859276 454760424 494859277 448184396 494859278 448184402 494859279 448184401 494859280 449426880 448184404"
          - name: vid06
            ids: "448184398 448184405 498749514 502119463 505575334 505922313 448184408 448184407 448184406 448184410 448184415 448184409 448184414 448184411 448184412 448184413 452094100 494859274 494859275 449426877 449426876"
          - name: vid07
            ids: "494859273 494859271 498749519 448184416 494859270 498749518 448184417 494859268 494859269 448184419 448184418 448184420 448184422 448184421 448184423 448184424 448184426 448184430 448184427 448184428 448184432"
          - name: vid08
            ids: "448184431 448184429 448184425 448184433 448184434 498749520 448184436 448184437 448184435 448184438 448184439 448184440 448184442 448184443 448184441 448184444 494859272 450326932 454760429 454760428 462492099"
          - name: vid09
            ids: "495380677 498749521 448184447 450573658 448184446 465292104 448184445 448184449 448184448 465573721 495680098 448184450 495680100 465573722 495680099 448184453 448184454 494859295 458073906 494859296 448184452"
          - name: vid10
            ids: "448184451 495680097 448184455 448184459 448184458 448184457 448184456 448184461 448184460 495680101 448184462 448184463 469373161 498749522 498749523 494859297 494859298"
    steps:
      - name: Fetch doc pages
        run: |
          for id in ${{ matrix.ids }}; do
            echo "=====DOC ${id} START====="
            curl -sSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 60 \
              "https://www.runninghub.ai/runninghub-api-doc-en/api-${id}.md" \
              || echo "FETCH-FAILED ${id}"
            echo ""
            echo "=====DOC ${id} END====="
          done
