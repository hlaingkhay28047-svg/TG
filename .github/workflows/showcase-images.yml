# Generate the landing Before/After showcase pairs (v5.61.0) on RunningHub.
#
# WHY A WORKFLOW: same story as hero-videos.yml — the maintenance container
# has no egress to runninghub.ai and this public repository must never carry
# the Enterprise key. The key arrives as a manual dispatch input, is masked
# in the very first step, lives only in this run's environment, and is never
# written to any file, artifact or output. Finished images travel home on the
# throwaway showcase-drop orphan branch (no .github in its tree, so the token
# needs no workflows permission), and the branch is deleted after the wave.
#
# WHAT IT MAKES (owner instructions 2026-08-31: new images; then "the model
# uses THIS face" — the promo-panel woman, fair complexion, clean white
# western/Vietnamese-style dress): two honest pairs -
#   pair 1  ba-retouch-before  : identity-preserving edit from her poster —
#                                natural un-retouched studio portrait
#           ba-retouch-after   : that base run through the shipped catalog's
#                                REAL "retouch" workflow prompt, verbatim
#   pair 2  ba-scene-before    : identity-preserving edit — white ao-dai
#                                dress on a plain studio backdrop
#           ba-scene-after     : that base run through the shipped catalog's
#                                REAL "bg-replace" workflow prompt, verbatim,
#                                plus the new-background description its
#                                optional slot exists to carry
# Both edits ride rhart-image-n-pro-official (the app's own Nano Banana Pro
# endpoints — documented, already-deployed apiPaths; nothing invented).
# Price-preview runs before every submit so the spend is visible in the log.
name: Generate showcase before-after pairs
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GENERATE to run (each image spends RunningHub credit)'
        required: true
      rh_key:
        description: 'RunningHub Enterprise key — used for this run only, masked, never stored'
        required: true
      pairs:
        description: 'space-separated pair names to build (retouch scene), or "all"'
        required: false
        default: 'all'
      tasks:
        description: 'COLLECT-ONLY: space-separated name:taskId pairs — skips submit and only polls + downloads already-paid tasks (names: ba-retouch-before ba-retouch-after ba-scene-before ba-scene-after)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: showcase-images
  cancel-in-progress: false
jobs:
  generate:
    if: ${{ inputs.confirm == 'GENERATE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Mask the key before any other step can log
        env:
          K: ${{ inputs.rh_key }}
        run: |
          echo "::add-mask::$K"
          echo "RH_KEY=$K" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Generate the pairs
        shell: bash
        env:
          PAIRS: ${{ inputs.pairs }}
          TASKS: ${{ inputs.tasks }}
        run: |
          set -euo pipefail   # deliberately NO set -x: nothing here may echo commands
          BASE="https://www.runninghub.ai/openapi/v2"
          AUTH="Authorization: Bearer $RH_KEY"
          EDIT_PATH="rhart-image-n-pro-official/edit"
          mkdir -p out
          # The AFTER prompts come from the shipped catalog itself, verbatim —
          # the showcase demonstrates exactly what the product sends.
          RETOUCH_PROMPT=$(python3 - <<'PY'
          import re, json
          src = open('panel/js/hnk_wf_catalog_data.js').read()
          cat = json.loads(re.search(r'var CATALOG = ({.*?});\n', src, re.S).group(1))
          print(next(i['prompt'] for c in cat['categories'] for i in c['items'] if i['id']=='retouch'))
          PY
          )
          BG_PROMPT=$(python3 - <<'PY'
          import re, json
          src = open('panel/js/hnk_wf_catalog_data.js').read()
          cat = json.loads(re.search(r'var CATALOG = ({.*?});\n', src, re.S).group(1))
          print(next(i['prompt'] for c in cat['categories'] for i in c['items'] if i['id']=='bg-replace'))
          PY
          )
          MEITU_PROMPT=$(python3 - <<'PY'
          import re, json
          src = open('panel/js/hnk_wf_catalog_data.js').read()
          cat = json.loads(re.search(r'var CATALOG = ({.*?});\n', src, re.S).group(1))
          print(next(i['prompt'] for c in cat['categories'] for i in c['items'] if i['id']=='pr-meitu'))
          PY
          )
          SCN_PROMPT=$(python3 - <<'PY'
          import re, json
          src = open('panel/js/hnk_wf_catalog_data.js').read()
          cat = json.loads(re.search(r'var CATALOG = ({.*?});\n', src, re.S).group(1))
          print(next(i['prompt'] for c in cat['categories'] for i in c['items'] if i['id']=='pr-scnVietnam'))
          PY
          )
          # v5.62.0 — the Concept Art Poster prompt, verbatim, with its two
          # design tokens filled exactly the way the app fills them: the
          # default emerald backdrop and the sample title the text box shows.
          CP_PROMPT=$(python3 - <<'PY'
          import re, json
          src = open('panel/js/hnk_wf_catalog_data.js').read()
          cat = json.loads(re.search(r'var CATALOG = ({.*?});\n', src, re.S).group(1))
          p = next((i['prompt'] for c in cat['categories'] for i in c['items'] if i['id']=='concept-poster'), '')
          p = p.replace('{{BG}}', '#123B2F (deep teal)')
          p = p.replace('{{TEXT}}', 'NGÂN KHÚC LAM GIANG')
          print(p)
          PY
          )
          # v5.63.0 — the Selection Edit prompt, verbatim, with its request
          # token filled the way a user would type it: one flower turns red.
          RG_PROMPT=$(python3 - <<'PY'
          import re, json
          src = open('panel/js/hnk_wf_catalog_data.js').read()
          cat = json.loads(re.search(r'var CATALOG = ({.*?});\n', src, re.S).group(1))
          p = next((i['prompt'] for c in cat['categories'] for i in c['items'] if i['id']=='region-edit'), '')
          p = p.replace('{{EDIT}}', 'change the white rose at the exact centre of the bouquet into a rich deep-red rose, keeping its shape, lighting and position; change nothing else anywhere in the image')
          print(p)
          PY
          )
          # v5.64.0 — the eight design-series prompts, verbatim from the
          # shipped catalog with tokens filled at their defaults and the
          # empty request lines stripped exactly like the app strips them.
          mkdir -p out/prompts
          python3 - <<'PY'
          import re, json
          src = open('panel/js/hnk_wf_catalog_data.js').read()
          cat = json.loads(re.search(r'var CATALOG = ({.*?});\n', src, re.S).group(1))
          caps = {'ink-atelier':'AUTUMN GOLD','doll-boudoir':'SWEET DREAM','gold-chrysanth':'GOLDEN HOUR','lion-dance':'HAPPY NEW YEAR','lotus-dance':'LOTUS POEM','lotus-garden':'LOTUS GARDEN','saigon-glam':'SAIGON NIGHTS','peony-night':'PEONY NIGHT'}
          n = 0
          for c in cat['categories']:
              for it in c['items']:
                  sid = it['id']
                  if sid not in caps: continue
                  bg = next(f for f in it['fields'] if f.get('type')=='color')['default']
                  p = it['prompt'].replace('{{BG}}', bg).replace('{{TEXT}}', caps[sid])
                  p = '\n'.join(l for l in p.split('\n') if '{{' not in l)
                  open('out/prompts/%s.txt' % sid, 'w').write(p)
                  n += 1
          print('series prompts written:', n)
          PY
          BG_SCENE="NEW BACKGROUND: a grand golden palace ballroom in warm evening candlelight — crystal chandeliers, tall gilded arches, marble floor with a soft reflection, gentle bokeh depth."
          # v2 (owner, 2026-08-31): the model is the promo-panel woman — both
          # bases are IDENTITY-PRESERVING edits from her poster (shipped in the
          # repo), fair clear complexion, clean white western/Vietnamese-style
          # dress. The before for the retouch pair keeps honest natural texture
          # so the divider still has real work to reveal.
          REF_IMG="docs/assets/site/promo-panel-poster.jpg"
          IDENTITY="Use the exact same woman and facial identity from the reference image — same face shape, eyes, eyebrows, nose, lips, jawline, expression character and apparent age; do not redesign or beautify her facial structure."
          # owner correction (2026-08-31): the first cut aged her — the face
          # came out longer and more gaunt than the reference. She is YOUNG
          # with very beautiful proportions; the base must hold them exactly.
          YOUTH="Her exact face proportions from the reference must be kept: she is a very young woman in her early twenties with soft, smooth, slightly rounded youthful cheeks, a gentle jawline and beautiful balanced facial proportions. Do NOT elongate, narrow, hollow, sharpen or age the face in any way — no gauntness, no sunken cheeks, no mature look."
          BASE_A_PROMPT="$IDENTITY $YOUTH Create a head-and-shoulders studio portrait of her facing the camera on a neutral gray seamless studio background with soft even lighting. Fair, clear complexion but RAW un-retouched skin: visible pores, a few small temporary blemishes, slight under-eye darkness, stray flyaway hairs, no makeup polish. She wears a simple clean white western-style blouse. 85mm portrait lens, photorealistic."
          BASE_B_PROMPT="$IDENTITY Create a full-length studio photograph of her standing on a plain light-gray seamless studio backdrop with soft even lighting, whole body and shoes visible, natural relaxed pose, soft contact shadow on the floor. She wears an elegant clean pure-white Vietnamese ao-dai-inspired modern dress — minimal, bright white, western-clean styling — with simple white shoes. Fair clear complexion, photorealistic."
          poll_and_fetch() { # $1=name  $2=taskId — RunningHub charges at SUBMIT,
            # so this half is the one that must never be lost
            local n="$1" tid="$2" deadline=$((SECONDS+600)) img="" q st
            echo "== $n: task $tid — polling"
            while [ $SECONDS -lt $deadline ]; do
              q=$(curl -s -X POST "$BASE/query" -H "$AUTH" -H "Content-Type: application/json" -d "{\"taskId\":\"$tid\"}") || { sleep 6; continue; }
              st=$(printf '%s' "$q" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("status") or "").upper())' 2>/dev/null) || st=""
              if [ "$st" = "SUCCESS" ]; then
                img=$(printf '%s' "$q" | python3 -c 'import json,sys; r=(json.load(sys.stdin).get("results") or [{}])[0]; print(r.get("url") or r.get("fileUrl") or "")')
                printf '%s' "$q" | python3 -c 'import json,sys; u=json.load(sys.stdin).get("usage") or {}; print("  usage:", u.get("consumeMoney"), u.get("consumeCoins"), "in", u.get("taskCostTime"), "s")' || true
                break
              elif [ "$st" = "FAILED" ]; then echo "  FAILED: $q"; return 1; fi
              sleep 6
            done
            [ -n "$img" ] || { echo "NO RESULT $n"; return 1; }
            echo "== $n: download"
            curl -sfL "$img" -o "out/$n.png" || { echo "DOWNLOAD FAILED $n"; return 1; }
            ls -la "out/$n.png"
          }
          submit() { # $1=name $2=apiPath $3=json-body -> polls and downloads
            local n="$1" path="$2" body="$3" sub tid
            echo "== $n: price preview"
            curl -s -X POST "$BASE/price-preview/$path" -H "$AUTH" -H "Content-Type: application/json" -d "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("  price:", (d.get("data") or {}).get("priceText") or d)' || true
            echo "== $n: submit"
            sub=$(curl -sf -X POST "$BASE/$path" -H "$AUTH" -H "Content-Type: application/json" -d "$body") || { echo "SUBMIT FAILED $n"; return 1; }
            tid=$(printf '%s' "$sub" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("taskId") or (d.get("data") or {}).get("taskId") or "")') || tid=""
            [ -n "$tid" ] || { echo "SUBMIT PARSE FAILED $n: $sub"; return 1; }
            echo "  taskId=$tid (collect with: <name>:$tid)"
            poll_and_fetch "$n" "$tid"
          }
          reupload() { # $1=file -> prints a fresh RunningHub URL for edit input
            local f="$1" up url
            up=$(curl -sf -X POST "$BASE/media/upload/binary" -H "$AUTH" -F "file=@$f;filename=$(basename "$f")") || return 1
            url=$(printf '%s' "$up" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["data"].get("download_url") or d["data"].get("fileName") or "")') || return 1
            [ -n "$url" ] || return 1
            case "$url" in http*) : ;; *) url="https://www.runninghub.ai/${url#/}";; esac
            printf '%s' "$url"
          }
          jbody() { python3 -c 'import json,sys; d={"prompt":sys.argv[1],"imageUrls":json.loads(sys.argv[2]),"resolution":"2k"}; ratio=sys.argv[3]; d.update({"aspectRatio":ratio} if ratio else {}); print(json.dumps(d))' "$1" "$2" "$3"; }
          fail=0
          if [ -n "$TASKS" ]; then
            for pair in $TASKS; do
              n="${pair%%:*}"; tid="${pair##*:}"
              [ -n "$n" ] && [ -n "$tid" ] || { echo "BAD PAIR $pair"; fail=1; continue; }
              poll_and_fetch "$n" "$tid" || fail=1
            done
            ls -la out/ || true
            exit $fail
          fi
          LIST="$PAIRS"; [ "$LIST" = "all" ] && LIST="retouch scene"
          refurl=$(reupload "$REF_IMG") || { echo "REFERENCE UPLOAD FAILED"; exit 1; }
          for p in $LIST; do
            case "$p" in
              retouch)
                submit "ba-retouch-before" "$EDIT_PATH" "$(jbody "$BASE_A_PROMPT" "[\"$refurl\"]" "3:4")" || { fail=1; continue; }
                u=$(reupload "out/ba-retouch-before.png") || { echo "REUPLOAD FAILED retouch"; fail=1; continue; }
                # the after is the full shipped pipeline: V2 Retouch, then the
                # Retouch A Style beauty finish (owner: အရမ်းချောအောင်)
                submit "ba-retouch-step" "$EDIT_PATH" "$(jbody "$RETOUCH_PROMPT" "[\"$u\"]" "3:4")" || { fail=1; continue; }
                u2=$(reupload "out/ba-retouch-step.png") || { echo "REUPLOAD FAILED retouch step"; fail=1; continue; }
                submit "ba-retouch-after" "$EDIT_PATH" "$(jbody "$MEITU_PROMPT" "[\"$u2\"]" "3:4")" || fail=1
                rm -f out/ba-retouch-step.png
                ;;
              scene)
                submit "ba-scene-before" "$EDIT_PATH" "$(jbody "$BASE_B_PROMPT" "[\"$refurl\"]" "2:3")" || { fail=1; continue; }
                u=$(reupload "out/ba-scene-before.png") || { echo "REUPLOAD FAILED scene"; fail=1; continue; }
                submit "ba-scene-after" "$EDIT_PATH" "$(jbody "$BG_PROMPT $BG_SCENE" "[\"$u\"]" "2:3")" || fail=1
                ;;
              glam)
                # owner (2026-08-31, on the shipped retouch after): "ဒါကို
                # အရမ်းချောအောင်" — one more REAL product pass, the catalog's
                # own pr-meitu "Retouch A Style" beauty finish, applied to the
                # already-shipped after image. The before stays untouched, so
                # the pair keeps its alignment and its honesty.
                ug=$(reupload "docs/assets/site/ba/ba-retouch-after.jpg") || { echo "GLAM UPLOAD FAILED"; fail=1; continue; }
                submit "ba-retouch-after" "$EDIT_PATH" "$(jbody "$MEITU_PROMPT" "[\"$ug\"]" "3:4")" || fail=1
                ;;
              finish)
                # rerun ONLY the after chain (V2 Retouch, then Retouch A
                # Style) on the shipped before. Each pass is ANCHORED to the
                # owner's reference poster as IMAGE 2: a synthetic chain
                # drifts older and harder with every hop (owner, twice: she
                # is younger and prettier than this) — a real customer photo
                # never drifts because the input IS the person, so pinning
                # the demo's identity to her true face is what makes the
                # showcase honest, not less so.
                ANCHOR="IMAGE 2 shows the SAME woman — her true face. While working on IMAGE 1, keep the facial identity, youth and proportions matching IMAGE 2 exactly: a very young woman in her early twenties with soft rounded youthful cheeks and beautiful balanced proportions — never older, longer, harder or more gaunt than IMAGE 2. In IMAGE 1, IMAGE 2's beauty at its freshest."
                uf=$(reupload "docs/assets/site/ba/ba-retouch-before.jpg") || { echo "FINISH UPLOAD FAILED"; fail=1; continue; }
                submit "ba-retouch-step" "$EDIT_PATH" "$(jbody "$ANCHOR $RETOUCH_PROMPT" "[\"$uf\",\"$refurl\"]" "3:4")" || { fail=1; continue; }
                u2=$(reupload "out/ba-retouch-step.png") || { echo "FINISH REUPLOAD FAILED"; fail=1; continue; }
                submit "ba-retouch-after" "$EDIT_PATH" "$(jbody "$ANCHOR $MEITU_PROMPT" "[\"$u2\",\"$refurl\"]" "3:4")" || fail=1
                rm -f out/ba-retouch-step.png
                ;;
              pairv2)
                # owner, three rounds: she keeps coming back older and harder
                # than her poster. Root cause: the BEFORE itself drifted, and
                # every further hop compounds. This path keeps every image ONE
                # hop from her true face: (1) her glam portrait straight from
                # the reference, (2) the before is that portrait with the raw
                # flaws added back (identical face, hair, framing), (3) the
                # after is ONE real Retouch A Style pass over that before,
                # anchored to the reference.
                GLAM_SRC="Using the reference image: the SAME woman, her exact face at its youngest and most beautiful — early twenties, soft rounded youthful cheeks, beautiful balanced proportions exactly as the reference. Create a head-and-shoulders studio portrait facing the camera on a neutral gray seamless background in soft even studio light, hair neatly and loosely tied back with a few soft strands, simple clean white blouse. Give her the full Vietnamese/Chinese glass-skin finish: flawless porcelain skin, milky bright even tone, dewy lifted glow, sparkling eyes with clean catchlights, fresh rosy lips. Photorealistic."
                DEGRADE="Keep this EXACT photograph — same woman, same face, same hair, same clothing, same pose, framing and background, pixel-for-pixel composition — and only make it look like the RAW un-retouched original the camera captured before any retouching: dull the skin slightly with natural uneven tone, add a few small temporary blemishes and faint under-eye darkness, add a few stray flyaway hairs, and remove the glow and gloss so the skin reads ordinary and matte. Change absolutely nothing else — not the face proportions, not the age, not the hair, not the clothes."
                ANCHOR2="IMAGE 2 shows the SAME woman — her true face. Keep the facial identity, youth and proportions matching IMAGE 2 exactly: early twenties, soft rounded youthful cheeks, beautiful balanced proportions — never older, longer or harder than IMAGE 2."
                submit "ba-glam-src" "$EDIT_PATH" "$(jbody "$GLAM_SRC" "[\"$refurl\"]" "3:4")" || { fail=1; continue; }
                ug1=$(reupload "out/ba-glam-src.png") || { echo "PAIRV2 UPLOAD1 FAILED"; fail=1; continue; }
                submit "ba-retouch-before" "$EDIT_PATH" "$(jbody "$DEGRADE" "[\"$ug1\"]" "3:4")" || { fail=1; continue; }
                ug2=$(reupload "out/ba-retouch-before.png") || { echo "PAIRV2 UPLOAD2 FAILED"; fail=1; continue; }
                submit "ba-retouch-after" "$EDIT_PATH" "$(jbody "$ANCHOR2 $MEITU_PROMPT" "[\"$ug2\",\"$refurl\"]" "3:4")" || fail=1
                rm -f out/ba-glam-src.png
                ;;
              afteronly)
                # one pure product pass: Retouch A Style (hair/wardrobe/pose
                # locks included) over the shipped before, no reference in the
                # call — the anchored variant copied IMAGE 2's whole scene,
                # and with a young one-hop before there is no drift left to
                # correct.
                ua=$(reupload "docs/assets/site/ba/ba-retouch-before.jpg") || { echo "AFTERONLY UPLOAD FAILED"; fail=1; continue; }
                submit "ba-retouch-after" "$EDIT_PATH" "$(jbody "$MEITU_PROMPT" "[\"$ua\"]" "3:4")" || fail=1
                ;;
              vnscene)
                # owner (2026-08-31, on the palace after): not the yellow
                # backdrop — a beautiful Library scene, natural indoor light,
                # tender skin. The catalog's own pr-scnVietnam (Vietnam soft
                # pastel set) prompt, verbatim, on the shipped scene before;
                # its LOCK keeps her and the white ao dai exactly as shot.
                us=$(reupload "docs/assets/site/ba/ba-scene-before.jpg") || { echo "VNSCENE UPLOAD FAILED"; fail=1; continue; }
                submit "ba-scene-after" "$EDIT_PATH" "$(jbody "$SCN_PROMPT" "[\"$us\"]" "2:3")" || fail=1
                ;;
              poster)
                # v5.62.0 — the Concept Art Poster card: the new workflow's
                # own shipped prompt over the shipped scene before (white ao
                # dai, one hop from her true face). Two outputs: the 3:2 card
                # photograph for lib/wf/cards5 and the portrait sample the
                # owner reviews.
                [ -n "$CP_PROMPT" ] || { echo "POSTER: concept-poster not in catalog on this ref"; fail=1; continue; }
                up=$(reupload "docs/assets/site/ba/ba-scene-before.jpg") || { echo "POSTER UPLOAD FAILED"; fail=1; continue; }
                submit "concept-poster-card" "$EDIT_PATH" "$(jbody "$CP_PROMPT" "[\"$up\"]" "3:2")" || fail=1
                submit "concept-poster-sample" "$EDIT_PATH" "$(jbody "$CP_PROMPT" "[\"$up\"]" "2:3")" || fail=1
                ;;
              freeform)
                # v5.62.1 — the Freeform/Edit page's OWN hero still (owner:
                # it shared Retouch B's flower-portrait). Same model, one hop
                # from her reference poster; wide dream-atelier design with
                # clear left negative space for the page's interface text.
                FREEFORM_PROMPT="Using the reference image: the SAME woman, her exact young face and beautiful balanced proportions — early twenties, soft rounded youthful cheeks, never older or harder than the reference. Create a cinematic wide studio banner: she stands waist-up at the right third of the frame in a dark teal-and-gold dream atelier, one hand raised with warm golden creative light streaming from her fingertips, while translucent glowing picture-frames of imagined scenes — a white wedding gown, a fairy forest, a golden temple — drift around her like floating holograms; fine gold light particles in the air, soft rim light on her hair, deep cinematic contrast, expensive editorial finish, photorealistic. She wears an elegant modern black-and-gold creative studio outfit. Wide 16:9 banner composition with clear dark negative space on the left third."
                submit "banner-freeform" "$EDIT_PATH" "$(jbody "$FREEFORM_PROMPT" "[\"$refurl\"]" "16:9")" || fail=1
                ;;
              region)
                # v5.63.0 — the Selection Edit card: two REAL product passes.
                # Base: the model holding a white-rose bouquet, one hop from
                # her reference poster. Edit: that base through the shipped
                # region-edit prompt asking for one red rose. The card itself
                # is composited LOCALLY by pasting ONLY the flower region of
                # the edit over the base, so outside the marquee the card is
                # byte-identical to the base — the same guarantee the
                # workflow makes inside Photoshop.
                [ -n "$RG_PROMPT" ] || { echo "REGION: region-edit not in catalog on this ref"; fail=1; continue; }
                RG_BASE="$IDENTITY $YOUTH Create a waist-up studio photograph of her facing the camera, smiling softly, holding a loose bouquet of pure white roses with both hands at chest height so the bouquet sits clearly at the centre-right of the frame. Soft warm studio light on a deep neutral backdrop, elegant cream blouse, photorealistic, fine crisp detail on every petal."
                submit "region-card-base" "$EDIT_PATH" "$(jbody "$RG_BASE" "[\"$refurl\"]" "3:2")" || { fail=1; continue; }
                ur=$(reupload "out/region-card-base.png") || { echo "REGION UPLOAD FAILED"; fail=1; continue; }
                submit "region-card-edit" "$EDIT_PATH" "$(jbody "$RG_PROMPT" "[\"$ur\"]" "3:2")" || fail=1
                ;;
              blue)
                # v5.64.0 — the Blue Silk Boudoir card: the workflow's own
                # shipped prompt (tokens at defaults, request lines stripped)
                # over the shipped scene before, 3:2 card geometry.
                BL_PROMPT=$(python3 - <<'PY'
          import re, json
          src = open('panel/js/hnk_wf_catalog_data.js').read()
          cat = json.loads(re.search(r'var CATALOG = ({.*?});\n', src, re.S).group(1))
          it = next((i for c in cat['categories'] for i in c['items'] if i['id']=='blue-silk'), None)
          if it:
              bg = next(f for f in it['fields'] if f.get('type')=='color')['default']
              p = it['prompt'].replace('{{BG}}', bg).replace('{{TEXT}}', 'BLUE SILK')
              print('\n'.join(l for l in p.split('\n') if '{{' not in l))
          PY
          )
                [ -n "$BL_PROMPT" ] || { echo "BLUE: not in catalog on this ref"; fail=1; continue; }
                ub=$(reupload "docs/assets/site/ba/ba-scene-before.jpg") || { echo "BLUE UPLOAD FAILED"; fail=1; continue; }
                submit "card-blue-silk" "$EDIT_PATH" "$(jbody "$BL_PROMPT" "[\"$ub\"]" "")" || fail=1  # source ratio: the prompt keeps IMAGE 1 framing; the card is cropped locally
                ;;
              derma)
                # v5.64.0 — the Derma Skin Pro card: ONE real product pass of
                # the shipped derma-skin prompt over the shipped raw-skin
                # before (visible pores and blemishes, one hop from her true
                # face). The split-face before/after card is composited
                # locally from this after and the untouched before.
                DS_PROMPT=$(python3 - <<'PY'
          import re, json
          src = open('panel/js/hnk_wf_catalog_data.js').read()
          cat = json.loads(re.search(r'var CATALOG = ({.*?});\n', src, re.S).group(1))
          print(next((i['prompt'] for c in cat['categories'] for i in c['items'] if i['id']=='derma-skin'), ''))
          PY
          )
                [ -n "$DS_PROMPT" ] || { echo "DERMA: not in catalog on this ref"; fail=1; continue; }
                ud=$(reupload "docs/assets/site/ba/ba-retouch-before.jpg") || { echo "DERMA UPLOAD FAILED"; fail=1; continue; }
                # two passes of the shipped prompt — the same button pressed
                # twice, the established multi-pass card practice (see the
                # retouch pair above); both outputs kept so the card uses the
                # cleanest honest result.
                submit "card-derma-p1" "$EDIT_PATH" "$(jbody "$DS_PROMPT" "[\"$ud\"]" "3:4")" || { fail=1; continue; }
                u2=$(reupload "out/card-derma-p1.png") || { echo "DERMA REUPLOAD FAILED"; fail=1; continue; }
                submit "card-derma-after" "$EDIT_PATH" "$(jbody "$DS_PROMPT" "[\"$u2\"]" "3:4")" || fail=1
                ;;
              series)
                # v5.64.0 — the eight design-series cards: each workflow's own
                # shipped prompt over the shipped scene before (one hop from
                # her true face), 3:2 card geometry, one submit per card.
                us=$(reupload "docs/assets/site/ba/ba-scene-before.jpg") || { echo "SERIES UPLOAD FAILED"; fail=1; continue; }
                for sid in ink-atelier doll-boudoir gold-chrysanth lion-dance lotus-dance lotus-garden saigon-glam peony-night; do
                  [ -s "out/prompts/$sid.txt" ] || { echo "SERIES: missing prompt $sid"; fail=1; continue; }
                  SP=$(cat "out/prompts/$sid.txt")
                  submit "card-$sid" "$EDIT_PATH" "$(jbody "$SP" "[\"$us\"]" "3:2")" || fail=1
                done
                rm -rf out/prompts
                ;;
              *) echo "UNKNOWN PAIR $p"; fail=1 ;;
            esac
          done
          ls -la out/ || true
          exit $fail
      - name: Publish the images as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-before-after
          path: out/
          retention-days: 3
          if-no-files-found: warn
      - name: Convert to shipping JPGs and push the drop branch
        if: success()
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick >/dev/null
          mkdir -p pub
          for f in out/*.png; do
            b=$(basename "$f" .png)
            # no crop, no resize beyond a sane web ceiling — the pair must stay
            # pixel-comparable; only the encode changes
            convert "$f" -resize '1440x1440>' -quality 86 "pub/$b.jpg"
          done
          ls -la pub/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ORPHAN commit holding ONLY the images — no .github in the tree, so
          # the token needs no workflows permission (the hero-clips lesson).
          git checkout --orphan showcase-drop
          git rm -rf --cached . >/dev/null
          mkdir -p docs/assets/site/ba
          cp pub/* docs/assets/site/ba/
          git add -f docs/assets/site/ba
          git commit -m "Showcase before/after pairs: generated drop"
          git push -f origin showcase-drop
